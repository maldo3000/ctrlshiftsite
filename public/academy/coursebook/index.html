/* Agrandir Wide is licensed and not bundled — same declaration as the Academy
   landing page, so dropping the files into ../fonts/ upgrades this page too. */

  font-family: 'Agrandir Wide';
  src: url('../fonts/AgrandirWide-Bold.woff2') format('woff2');
  font-weight: 700;
  font-display: swap;

}

  font-family: 'Space Mono';
  src: url('./fonts/space-mono-latin-400.woff2') format('woff2');
  font-weight: 400;

}
@font-face {
  font-family: 'Space Mono';
  src: url('./fonts/space-mono-latin-700.woff2') format('woff2');

}

/* --- Tokens: light ("paper") is the base, dark ("studio") overrides --- */
:root {
  --mono: 'Space Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
  --text-face: 'CS Text', Georgia, 'Times New Roman', serif;
  --display: 'Agrandir Wide', 'Work Sans', 'Inter', -apple-system, sans-serif;
  --ui: 'Aileron', 'Inter', -apple-system, sans-serif;

  --ink: #F4F7EE;
  --surface: #F4F7EE;
  --surface-2: #E7EBDF;
  --paper: #0A0C07;
  --text: rgba(10, 12, 7, 0.82);
  --muted: rgba(10, 12, 7, 0.52);
  --faint: rgba(10, 12, 7, 0.32);
  --rule: rgba(10, 12, 7, 0.15);
  --rule-soft: rgba(10, 12, 7, 0.08);
  --glass: rgba(244, 247, 238, 0.86);
  --grain: 0;

  /* Generative Media runs the Academy's acid purple */
  --acid: #6E3FBF;
  --light: var(--acid);

  --step--1: 0.72rem;
  --step-0: 1.02rem;
  --step-1: 1.24rem;
  --step-2: 1.55rem;
  --step-3: 2.1rem;
  --step-4: clamp(2.3rem, 5vw, 3.1rem);

  --rail-w: 19.5rem;
  --measure: 34rem;
  --radius: 0.85rem;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ink: #070906;
    --surface: #070906;
    --surface-2: #0D100A;
    --paper: #F4F7EE;
    --text: rgba(244, 247, 238, 0.8);
    --muted: #9AA093;
    --faint: #565B50;
    --rule: rgba(244, 247, 238, 0.11);
    --rule-soft: rgba(244, 247, 238, 0.06);
    --glass: rgba(7, 9, 6, 0.86);
    --grain: 0.045;
    --acid: #A06EE7;
  }
}

:root[data-theme='dark'] {
  --ink: #070906;
  --surface: #070906;
  --surface-2: #0D100A;
  --paper: #F4F7EE;
  --text: rgba(244, 247, 238, 0.8);
  --muted: #9AA093;
  --faint: #565B50;
  --rule: rgba(244, 247, 238, 0.11);
  --rule-soft: rgba(244, 247, 238, 0.06);
  --glass: rgba(7, 9, 6, 0.86);
  --grain: 0.045;
  --acid: #A06EE7;
  color-scheme: dark;
}

:root[data-theme='light'] {
  --ink: #F4F7EE;
  --surface: #F4F7EE;
  --surface-2: #E7EBDF;
  --paper: #0A0C07;
  --text: rgba(10, 12, 7, 0.82);
  --muted: rgba(10, 12, 7, 0.52);
  --faint: rgba(10, 12, 7, 0.32);
  --rule: rgba(10, 12, 7, 0.15);
  --rule-soft: rgba(10, 12, 7, 0.08);
  --glass: rgba(244, 247, 238, 0.86);
  --grain: 0;
  --acid: #6E3FBF;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--ink);
  color: var(--text);
  font-family: var(--text-face);
  font-size: var(--step-0);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

a { color: inherit; }

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--paper);
  outline-offset: 2px;
  border-radius: 4px;
}

::selection { background: color-mix(in srgb, var(--paper) 26%, transparent); }

.skip {
  position: absolute;
  left: 0.75rem;
  top: -4rem;
  z-index: 200;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
  padding: 0.55rem 0.9rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--paper);
  text-decoration: none;
  transition: top 160ms ease;
}

.skip:focus { top: 0.75rem; }

/* Visually hidden, still announced */
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}

[hidden] { display: none !important; }

/* ---------------------------- Brand mark ---------------------------- */

.mark {
  display: inline-flex;
  align-items: center;
  gap: 0.45em;
  font-family: var(--ui);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  white-space: nowrap;
  color: var(--paper);
}

.mark .academy { color: var(--acid); }

/* ------------------------------ Shell ------------------------------ */

.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-height: 100vh;
}

/* --- Contents rail --- */

.rail {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  height: 100vh;
  border-right: 1px solid var(--rule);
  background: var(--surface);
}

.rail-head {
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
  border-bottom: 1px solid var(--rule);
  padding: 1.15rem 1.15rem 1rem;
}

.rail-brand .btn { padding: 0.4rem 0.5rem; line-height: 0; }

.rail-brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem;
}

.rail-brand .mark { font-size: 0.82rem; }

.rail-sub {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
}

.rail-search {
  position: relative;
  display: flex;
  align-items: center;
}

.rail-search input {
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: none;
  padding: 0.5rem 2.4rem 0.5rem 0.7rem;
  font-family: var(--mono);
  font-size: 0.74rem;
  color: var(--paper);
}

.rail-search input::placeholder { color: var(--faint); }

.rail-search kbd {
  position: absolute;
  right: 0.45rem;
  border: 1px solid var(--rule);
  border-radius: 0.28rem;
  padding: 0.1rem 0.34rem;
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--muted);
  pointer-events: none;
}

.rail-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0.9rem 0.75rem 2.5rem;
  scrollbar-width: thin;
}

.rail-foot {
  border-top: 1px solid var(--rule);
  padding: 0.75rem 1.15rem;
}

.part { margin-bottom: 1.15rem; }

.part-head {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0 0.4rem 0.5rem;
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--light);
}

.part-head::before {
  content: '';
  width: 0.7rem;
  height: 2px;
  background: var(--light);
  box-shadow: 0 0 8px var(--light);
  flex: none;
  transform: translateY(-0.2em);
}

.toc-link {
  display: grid;
  grid-template-columns: 1.8rem minmax(0, 1fr) 0.9rem;
  align-items: baseline;
  gap: 0.25rem;
  width: 100%;
  border: 0;
  border-radius: 8px;
  background: none;
  padding: 0.4rem 0.45rem;
  text-align: left;
  font-family: var(--mono);
  font-size: 0.755rem;
  line-height: 1.35;
  color: var(--muted);
  cursor: pointer;
  transition: color 140ms ease, background-color 140ms ease;
}

.toc-link:hover { color: var(--paper); background: var(--surface-2); }

.toc-link .t {
  font-family: var(--display);
  font-size: 0.845rem;
  font-weight: 450;
  letter-spacing: -0.008em;
}

.toc-link .n {
  font-size: 0.66rem;
  color: var(--faint);
  font-variant-numeric: tabular-nums;
}

.toc-link[aria-current='true'] {
  color: var(--paper);
  background: color-mix(in srgb, var(--paper) 10%, transparent);
}

.toc-link[aria-current='true'] .n { color: var(--paper); }

.toc-link .tick { opacity: 0; color: var(--paper); font-size: 0.7rem; }
.toc-link.is-done .tick { opacity: 1; }
.toc-link.is-done .t { text-decoration: line-through; text-decoration-color: var(--faint); }

.toc-empty {
  padding: 1rem 0.5rem;
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--muted);
}

.hit {
  display: block;
  padding-left: 2.05rem;
  font-family: var(--text-face);
  font-size: 0.78rem;
  font-style: italic;
  color: var(--faint);
  grid-column: 1 / -1;
}
.hit mark {
  background: color-mix(in srgb, var(--paper) 24%, transparent);
  color: var(--paper);
  border-radius: 2px;
}

/* --- Progress meter --- */

.meter {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.meter-track {
  position: relative;
  flex: 1;
  height: 3px;
  border-radius: 2px;
  background: var(--rule-soft);
  overflow: hidden;
}

.meter-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: var(--paper);
  transition: width 320ms cubic-bezier(0.33, 1, 0.68, 1);
}

.meter-num { font-variant-numeric: tabular-nums; color: var(--paper); }

/* --------------------------- Top bar --------------------------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  border-bottom: 1px solid var(--rule);
  background: var(--glass);
  backdrop-filter: blur(14px);
  padding: 0.6rem 1.5rem;
  min-height: 3.1rem;
}

.topbar-where {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  min-width: 0;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.topbar-where b {
  color: var(--paper);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.topbar-spacer { flex: 1; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  border: 1px solid var(--rule);
  border-radius: 10px;
  background: none;
  padding: 0.5rem 0.9rem;
  font-family: var(--ui);
  font-weight: 700;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text);
  cursor: pointer;
  transition: border-color 140ms ease, color 140ms ease, background-color 140ms ease;
}

.btn:hover { border-color: var(--paper); color: var(--paper); }

.btn-ghost { border-color: transparent; }
.btn-ghost:hover { border-color: var(--rule); }

.btn-primary {
  border-color: var(--paper);
  background: var(--paper);
  color: var(--ink);
}
.btn-primary:hover { background: var(--paper); color: var(--ink); opacity: 0.86; }

.btn[aria-pressed='true'] {
  border-color: var(--paper);
  background: var(--paper);
  color: var(--ink);
}

.rail-toggle { display: none; }

/* --------------------------- Reader --------------------------- */

.main { min-width: 0; }

.reader { padding: 0 1.5rem 7rem; }

.chapter {
  display: grid;
  grid-template-columns: minmax(0, var(--measure)) minmax(0, 17rem);
  gap: 0 3.5rem;
  align-items: start;
  margin: 0 auto;
  max-width: 58rem;
  padding-top: 3.25rem;
}

.chapter > .col-main { grid-column: 1; min-width: 0; }
.chapter > .col-side { grid-column: 2; position: sticky; top: 5rem; display: grid; gap: 0.75rem; }

/* Chapter header */

.ch-head { position: relative; margin-bottom: 2.6rem; }

.ch-eyebrow {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin: 0 0 1.1rem;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
}

.ch-eyebrow .dot {
  width: 0.42rem;
  height: 0.42rem;
  border-radius: 50%;
  background: var(--paper);
  flex: none;
}

.ch-number {
  display: block;
  margin: 0 0 0.35rem;
  font-family: var(--mono);
  font-size: 0.78rem;
  font-weight: 500;
  letter-spacing: 0.3em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.ch-title {
  margin: 0;
  font-family: var(--display);
  font-size: var(--step-4);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.02;
  color: var(--paper);
  text-wrap: balance;
}

.ch-thesis {
  margin: 1.2rem 0 0;
  max-width: 30rem;
  font-size: var(--step-1);
  font-style: italic;
  line-height: 1.6;
  color: var(--muted);
  text-wrap: pretty;
}

.ch-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 1.1rem;
  margin-top: 1.6rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
}

/* Prose */

.prose { display: flow-root; }

.prose > * + * { margin-top: 1.15rem; }

.prose p {
  margin: 0;
  line-height: 1.78;
  text-wrap: pretty;
}

.prose h2 {
  margin: 3rem 0 0;
  font-family: var(--display);
  font-size: var(--step-2);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.22;
  color: var(--paper);
  text-wrap: balance;
}

.prose h2 + * { margin-top: 0.9rem; }

.prose h3 {
  margin: 2rem 0 0;
  font-family: var(--mono);
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.prose h3 + * { margin-top: 0.7rem; }

.prose ul, .prose ol {
  margin: 0;
  padding-left: 1.1rem;
  display: grid;
  gap: 0.5rem;
}

.prose li { line-height: 1.65; padding-left: 0.15rem; }

.prose li::marker { color: var(--faint); font-size: 0.85em; }

.prose strong { color: var(--paper); font-weight: 600; }

.prose em { font-style: italic; }

.prose a {
  color: var(--paper);
  text-decoration: underline;
  text-decoration-color: var(--paper);
  text-underline-offset: 0.2em;
}

.prose code, .code {
  font-family: var(--mono);
  font-size: 0.82em;
  border: 1px solid var(--rule-soft);
  border-radius: 0.3rem;
  background: var(--surface-2);
  padding: 0.1em 0.35em;
  color: var(--paper);
}

.lede {
  font-size: var(--step-1);
  line-height: 1.7;
  color: var(--paper);
}

.lede::first-letter {
  float: left;
  margin: 0.06em 0.14em 0 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: 3.1em;
  line-height: 0.86;
  color: var(--paper);
}

.pull {
  margin: 2.4rem 0;
  border-left: 2px solid var(--paper);
  padding: 0.2rem 0 0.2rem 1.3rem;
  font-size: var(--step-2);
  font-style: italic;
  line-height: 1.45;
  color: var(--paper);
  text-wrap: balance;
}

.note {
  border-left: 2px solid var(--paper);
  padding: 0.15rem 0 0.15rem 1.3rem;
}

.note-label {
  display: block;
  margin-bottom: 0.45rem;
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--paper);
}

.note p { font-size: 0.96rem; line-height: 1.7; }

/* Definition rows — used for term lists inside prose */

.defs { display: grid; gap: 0; border-top: 1px solid var(--rule-soft); }

.def {
  display: grid;
  grid-template-columns: 9.5rem minmax(0, 1fr);
  gap: 0 1.1rem;
  border-bottom: 1px solid var(--rule-soft);
  padding: 0.75rem 0;
}

.def dt {
  font-family: var(--mono);
  font-size: 0.72rem;
  letter-spacing: 0.02em;
  color: var(--paper);
  padding-top: 0.15rem;
}

.def dd { margin: 0; font-size: 0.95rem; line-height: 1.6; }

/* Side column cards */

.card {
  border-top: 1px solid var(--rule);
  padding: 0.8rem 0 0.4rem;
}

.card-label {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  margin: 0 0 0.55rem;
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--muted);
}

.card-label::before {
  content: '';
  width: 0.55rem;
  height: 1px;
  background: var(--muted);
  flex: none;
}

.card p { margin: 0; font-size: 0.9rem; line-height: 1.62; }

.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.4rem; }

.card li {
  font-family: var(--mono);
  font-size: 0.7rem;
  line-height: 1.45;
  color: var(--text);
}

.card-deliver p { font-style: italic; color: var(--paper); }

/* --------------------------- Widgets --------------------------- */

.widget {
  margin: 2.75rem 0;
  border-top: 1px solid var(--rule);
}

.widget-head {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.75rem 0 0;
}

.widget-head h4 {
  margin: 0;
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper);
}

.widget-head .tag {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.widget-body { padding: 0.9rem 0 0.4rem; display: grid; gap: 1rem; }

.widget-body p { margin: 0; font-size: 0.93rem; line-height: 1.62; }

.readout {
  font-family: var(--mono);
  font-size: 0.76rem;
  line-height: 1.7;
  color: var(--paper);
  font-variant-numeric: tabular-nums;
}

.readout .k { color: var(--muted); }
.readout .v { color: var(--light); }

.field { display: grid; gap: 0.4rem; }

.field-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.75rem;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.field-label output {
  color: var(--light);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
}

input[type='range'] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 1.1rem;
  background: none;
  cursor: pointer;
}

input[type='range']::-webkit-slider-runnable-track {
  height: 3px;
  border-radius: 2px;
  background: var(--rule);
}
input[type='range']::-moz-range-track {
  height: 3px;
  border-radius: 2px;
  background: var(--rule);
}
input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 0.85rem;
  height: 0.85rem;
  margin-top: -0.38rem;
  border: 0;
  border-radius: 50%;
  background: var(--light);
  box-shadow: 0 0 10px var(--light);
}
input[type='range']::-moz-range-thumb {
  width: 0.85rem;
  height: 0.85rem;
  border: 0;
  border-radius: 50%;
  background: var(--light);
  box-shadow: 0 0 10px var(--light);
}

select, input[type='text'], input[type='number'], textarea {
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--ink);
  padding: 0.5rem 0.65rem;
  font-family: var(--mono);
  font-size: 0.76rem;
  color: var(--paper);
}

textarea { resize: vertical; min-height: 6.5rem; line-height: 1.6; }

.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }

.chip {
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--ink);
  padding: 0.32rem 0.7rem;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--muted);
  cursor: pointer;
  transition: border-color 140ms ease, color 140ms ease, background-color 140ms ease;
}

.chip:hover { color: var(--paper); border-color: var(--light); }

.chip[aria-pressed='true'], .chip.is-on {
  border-color: var(--light);
  background: color-mix(in srgb, var(--light) 16%, transparent);
  color: var(--paper);
}

.chip.is-right { border-color: var(--light); color: var(--paper); }
.chip.is-wrong { border-color: color-mix(in srgb, var(--paper) 40%, transparent); opacity: 0.5; text-decoration: line-through; }

.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.85rem; }
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 0.6rem; }

.bar-row {
  display: grid;
  grid-template-columns: 7.5rem minmax(0, 1fr) 4.2rem;
  align-items: center;
  gap: 0.7rem;
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--muted);
}

.bar-row .bar {
  height: 0.55rem;
  border-radius: 2px;
  background: var(--rule-soft);
  overflow: hidden;
}

.bar-row .bar span {
  display: block;
  height: 100%;
  background: var(--light);
  transition: width 260ms cubic-bezier(0.33, 1, 0.68, 1);
}

.bar-row .val { text-align: right; color: var(--paper); font-variant-numeric: tabular-nums; }

canvas { display: block; width: 100%; border-radius: 8px; background: var(--ink); }

.funnel { display: grid; gap: 0.55rem; }

.funnel-step {
  display: grid;
  grid-template-columns: 3.4rem minmax(0, 1fr);
  align-items: center;
  gap: 0.7rem;
}

.funnel-note {
  display: block;
  margin-top: 0.25rem;
  font-family: var(--mono);
  font-size: 0.64rem;
  color: var(--muted);
}

.funnel-bar {
  min-width: 7.5rem;
  height: 2rem;
  border-radius: 0.35rem;
  background: color-mix(in srgb, var(--light) 22%, transparent);
  border: 1px solid color-mix(in srgb, var(--light) 40%, transparent);
  display: flex;
  align-items: center;
  padding: 0 0.6rem;
  font-family: var(--mono);
  font-size: 0.66rem;
  color: var(--paper);
  transition: width 300ms cubic-bezier(0.33, 1, 0.68, 1);
  white-space: nowrap;
  overflow: hidden;
}

.funnel-step .n {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--light);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.ratio-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--ink);
  min-height: 13rem;
  padding: 1rem;
}

.ratio-box {
  position: relative;
  background:
    repeating-linear-gradient(45deg, var(--surface-2) 0 8px, var(--surface) 8px 16px);
  border: 1px solid var(--light);
  transition: width 260ms ease, height 260ms ease;
  max-width: 100%;
}

.ratio-safe {
  position: absolute;
  inset: 8%;
  border: 1px dashed color-mix(in srgb, var(--paper) 45%, transparent);
}

.ratio-label {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--paper);
  white-space: nowrap;
}

/* --------------------------- Quiz --------------------------- */

.quiz { display: grid; gap: 1.15rem; }

.q { display: grid; gap: 0.6rem; }

.q-stem { margin: 0; font-size: 0.98rem; line-height: 1.6; color: var(--paper); }

.q-opts { display: grid; gap: 0.4rem; }

.opt {
  display: grid;
  grid-template-columns: 1.3rem minmax(0, 1fr);
  gap: 0.5rem;
  align-items: start;
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: none;
  padding: 0.6rem 0.7rem;
  text-align: left;
  font-size: 0.92rem;
  line-height: 1.5;
  cursor: pointer;
  transition: border-color 140ms ease, background-color 140ms ease;
}

.opt:hover:not([disabled]) { border-color: var(--paper); }

.opt .mk {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--faint);
  padding-top: 0.1rem;
}

.opt[data-state='right'] {
  border-color: var(--paper);
  background: color-mix(in srgb, var(--paper) 10%, transparent);
}
.opt[data-state='right'] .mk { color: var(--paper); }

.opt[data-state='wrong'] {
  border-color: color-mix(in srgb, var(--paper) 35%, transparent);
  opacity: 0.62;
}

.opt[disabled] { cursor: default; }

.q-why {
  display: none;
  border-left: 1px solid var(--rule);
  padding-left: 0.85rem;
  font-size: 0.9rem;
  font-style: italic;
  line-height: 1.6;
  color: var(--muted);
}

.q.is-answered .q-why { display: block; }

/* --------------------------- Tasks --------------------------- */

.tasks { display: grid; gap: 0.15rem; }

.task {
  display: grid;
  grid-template-columns: 1.15rem minmax(0, 1fr);
  gap: 0.65rem;
  align-items: start;
  border-radius: 0.45rem;
  padding: 0.45rem 0.5rem;
  cursor: pointer;
  transition: background-color 140ms ease;
}

.task:hover { background: var(--surface-2); }

.task input {
  appearance: none;
  -webkit-appearance: none;
  width: 1.02rem;
  height: 1.02rem;
  margin: 0.18rem 0 0;
  border: 1px solid var(--rule);
  border-radius: 0.25rem;
  background: var(--ink);
  cursor: pointer;
  display: grid;
  place-content: center;
}

.task input::after {
  content: '';
  width: 0.5rem;
  height: 0.28rem;
  border-left: 2px solid var(--ink);
  border-bottom: 2px solid var(--ink);
  transform: rotate(-45deg) scale(0);
  transition: transform 120ms ease;
}

.task input:checked { background: var(--paper); border-color: var(--paper); }
.task input:checked::after { transform: rotate(-45deg) scale(1); }

.task span { font-size: 0.94rem; line-height: 1.55; }
.task input:checked + span { color: var(--muted); }

/* --------------------------- Notes --------------------------- */

.notes-status {
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

/* --------------------------- Chapter foot --------------------------- */

.ch-foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem;
  margin-top: 3.5rem;
  border-top: 1px solid var(--rule);
  padding-top: 1.4rem;
}

.pager {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
  gap: 0.7rem;
  margin-top: 1.5rem;
}

.pager-link {
  display: grid;
  gap: 0.35rem;
  border: 0;
  border-top: 1px solid var(--rule);
  background: none;
  padding: 0.95rem 0 0;
  cursor: pointer;
  text-align: left;
  transition: opacity 140ms ease;
}

.pager-link:hover .t { text-decoration: underline; text-underline-offset: 0.22em; }

.pager-link[disabled] { opacity: 0.3; cursor: default; }

.pager-link .dir {
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--muted);
}

.pager-link .t {
  font-family: var(--display);
  font-size: 0.95rem;
  font-weight: 550;
  letter-spacing: -0.012em;
  color: var(--paper);
  line-height: 1.35;
}

.pager-link.next { text-align: right; }

/* --------------------------- Cover --------------------------- */

.cover { max-width: 58rem; margin: 0 auto; padding-top: 3.5rem; }

.cover-plate { padding: 0 0 3.5rem; }

.cover-inner { position: relative; }

.cover .mark { font-size: 0.92rem; }

.cover h1 {
  margin: 1.6rem 0 0;
  font-family: var(--display);
  font-size: clamp(2.5rem, 7.4vw, 4.9rem);
  font-weight: 800;
  letter-spacing: -0.042em;
  line-height: 0.94;
  color: var(--paper);
  text-wrap: balance;
}

.cover-edition {
  margin: 1.4rem 0 0;
  font-family: var(--mono);
  font-size: 0.66rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
}

.cover-lede {
  margin: 1.8rem 0 0;
  max-width: 34rem;
  font-size: var(--step-1);
  line-height: 1.72;
  color: var(--text);
}

<p class="lede">Photography was not accepted as art for roughly sixty years. Sampling was theft until it was hip-hop. Non-linear editing was for people who could not cut film properly. The pattern repeats so reliably that it is almost boring: a technology lowers the cost of making something, the people who paid the old cost object, and then the work gets good enough that the argument ends.</p>

<p>Generative AI is at the loud part of that cycle. Which is inconvenient, because you have to work while the argument is still going on.</p>

<p>This chapter is not a defence of the technology. It is an attempt to be precise about what actually changed, so that you spend your effort on the parts that still matter.</p>

<h2>What actually changed</h2>

<p>One thing: <strong>the marginal cost of a first draft went to nearly zero.</strong></p>

<p>Not the cost of a finished film. Not the cost of a good idea. The cost of <em>the first version of a visual thing</em>. A storyboard frame used to cost an artist an afternoon. A previz sequence used to cost a small team a week. A stock shot of a specific thing in a specific light either existed or it did not, and if it did not, you either shot it, paid for it, or rewrote the scene.</p>

<p>Every one of those constraints was invisible in the finished work, but they shaped everything. They decided which ideas got tried. Most ideas died not because they were bad but because they were expensive to test.</p>

<p class="pull">The bottleneck moved. It used to be production. Now it is judgment.</p>

<p>When a draft costs nothing, you can try the version you were not sure about. You can shoot the sequence that only works if the light is wrong. You can find out that your idea is bad on Tuesday instead of in month three.</p>

<h2>What did not change</h2>

<p>Nothing on the other side of the ledger. A model has no opinion about what is worth making. It has no memory of what moved you, no reason to prefer one cut over another, and no stake in whether anyone watches.</p>

<div class="defs">
  <dl class="def"><dt>Still yours</dt><dd>Deciding what to make and why anyone should care.</dd></dl>
  <dl class="def"><dt>Still yours</dt><dd>Story structure, pacing, and the emotional shape of a piece.</dd></dl>
  <dl class="def"><dt>Still yours</dt><dd>Taste — knowing which of the forty outputs is the good one, and why.</dd></dl>
  <dl class="def"><dt>Still yours</dt><dd>Knowing when it is finished.</dd></dl>
</div>

<p>This is not a comforting platitude for nervous creatives. It is an observation about where the work went. When generation is cheap, the scarce skill becomes <em>selection</em>, and selection is a taste problem. Part III of this book is entirely about that.</p>

<div class="widget" data-widget="medium"></div>

<h2>The future of storytelling is mostly the past of storytelling</h2>

<p>Predictions about AI narrative tend to leap straight to infinite personalised interactive stories. Maybe. But the more useful near-term read is duller and more actionable:</p>

<ul>
  <li><strong>Formats get cheaper before they get stranger.</strong> The first real wave is not new art forms — it is ads, explainers, music videos, title sequences and shorts made by two people instead of twenty.</li>
  <li><strong>Volume goes up, so distinctiveness gets more valuable.</strong> When everyone can produce competent footage, competent stops being a differentiator.</li>
  <li><strong>Hybrid becomes normal.</strong> Live plates with generated extensions, real actors with synthetic environments, practical audio with generated score. Purity is not a virtue; the audience cannot see your pipeline.</li>
</ul>

<h2>Collaborator, not replacement</h2>

<p>The framing you adopt changes the work you get out of it. Three common stances:</p>

<div class="defs">
  <dl class="def"><dt>Vending machine</dt><dd>Type request, receive film. Produces generic work, then disappointment. This is the stance most people start with and it fails within a week.</dd></dl>
  <dl class="def"><dt>Threat</dt><dd>Refuse to engage, on principle. A legitimate personal choice, but it does not survive contact with a client budget, and it leaves you unable to critique the thing you object to.</dd></dl>
  <dl class="def"><dt>Collaborator</dt><dd>Treat the model as a fast, tireless, tasteless collaborator with an encyclopaedic memory and no judgment. You bring intent and discrimination. It brings volume and speed.</dd></dl>
</div>

<p>The third stance is not optimism. It is just the one that matches how the tools actually behave. A model is very good at giving you forty options and completely incapable of telling you which one is right — which is precisely the division of labour a director already knows how to run.</p>

<div class="note">
  <span class="note-label">Where this leaves you</span>
  <p>You are not learning software. Software changes every quarter. You are learning to direct a production where the crew is instant, unlimited and has no taste — and where every decision that used to be forced by budget is now yours to make on purpose.</p>
</div>

  thesis: 'You do not need the mathematics. You do need an accurate mental model, because a wrong one produces wrong instincts.',

  body: `
<p class="lede">Most creatives learn these tools by superstition. A prompt works once, so it becomes a ritual. Words get added because someone on a forum swore by them. It produces a folder of incantations that stop working the moment a model updates.</p>

<p>The cure is a mental model that is simple, non-technical, and roughly true. Here is the whole thing in one line: <strong>a generative model is a very large function that has been shown an enormous amount of material and tuned until it can continue patterns from it.</strong> Everything below is detail on that sentence.</p>

<h2>What is a model?</h2>

<p>A model is a file full of numbers — the <em>weights</em> — plus the code to run them. Nothing is stored in it the way a photo is stored on a drive. There is no library of images inside, no lookup table. There is a very large set of dials, tuned so that the whole apparatus is good at one narrow thing: predicting what comes next.</p>

<p>That is worth sitting with. When you ask for a cinematic wide shot of a lighthouse in fog, the model is not retrieving a lighthouse. It is producing something that has the statistical shape of lighthouse-in-fog images, given everything it has seen. This is why it can make a lighthouse that has never existed, and also why it can confidently give you a lighthouse with two doors.</p>

<h2>Training vs inference</h2>

<div class="defs">
  <dl class="def"><dt>Training</dt><dd>The one-time, extremely expensive process of tuning the weights. Weeks or months, thousands of GPUs, millions of dollars. Done by the lab, not by you.</dd></dl>
  <dl class="def"><dt>Fine-tuning</dt><dd>A small, cheap follow-up training run that nudges an existing model toward a style, a face, or a subject. This is what a LoRA is.</dd></dl>
  <dl class="def"><dt>Inference</dt><dd>Running the finished model to get an output. Seconds to minutes. This is what you pay for per generation, and what your credits buy.</dd></dl>
</div>

<p>The practical consequence: <strong>your prompt does not teach the model anything.</strong> Nothing you type changes the weights. Every generation starts from the same fixed model with no memory of your last ten attempts unless the interface deliberately feeds them back in. Iteration is your loop, not the model's.</p>

<h2>Datasets and pre-training</h2>

<p>What a model has seen determines what it can do, and — more usefully — what it is biased toward. Image models trained heavily on stock photography drift toward stock composition. Models with a lot of concept art in the mix will happily push everything toward concept art. Video models trained on short clips are better at short clips.</p>

<p>When a model keeps giving you a look you did not ask for, you are usually seeing the dataset's centre of gravity. The fix is rarely a stronger adjective; it is a more specific reference, or a different model whose gravity sits closer to where you want to be.</p>

<h2>Latent space</h2>

<p>Models do not work with pixels or letters directly. They work in a compressed internal representation — <em>latent space</em> — where similar things sit near each other. Not similar in colour: similar in meaning. Portraits cluster near portraits. Rust-and-neon cyberpunk sits near rust-and-neon cyberpunk.</p>

<p>Every generation is a point picked out of that space. A prompt is a way of steering toward a neighbourhood; a seed picks the specific point; a reference image drags the whole search closer to something you already have. That is the entire mechanic behind style consistency, character consistency and image-to-video, and it is why "make it more like this picture" is a far stronger instruction than "make it better".</p>

<div class="widget" data-widget="latent"></div>

<h2>Diffusion, in plain terms</h2>

<p>Most image and video models are diffusion models. The training idea is almost comically simple:</p>

<ol>
  <li>Take a real image. Add a little noise. Then more. Repeat until it is pure static.</li>
  <li>Train a model to undo one step of that — to look at a noisy image and predict a slightly less noisy version.</li>
  <li>Do this across hundreds of millions of images until it is very good at the undoing.</li>
</ol>

<p>To generate, you start from pure noise and run the undoing repeatedly, steering each step with your prompt. The picture does not get drawn. It gets <em>uncovered</em> — structure first, then form, then detail.</p>

<div class="widget" data-widget="diffusion"></div>

<p>Two working consequences fall straight out of this. Composition is decided early, in the first handful of steps, which is why prompt words about layout matter more than words about surface detail. And more steps mostly buys refinement, not a different idea — if the composition is wrong at step five, it will still be wrong at step fifty.</p>

<h2>Transformers, at altitude</h2>

<p>Language models — and the text-understanding half of most image and video models — are transformers. The mechanism that matters to you is <em>attention</em>: when processing any part of the input, the model weighs how relevant every other part is.</p>

<p>This is why word order and grammatical proximity change your results. "A red car in front of a blue house" and "a blue car in front of a red house" contain identical words. Attention is what keeps the colours attached to the right nouns — and attention is also what fails when you write a prompt with nine competing clauses. Concept bleed is an attention problem. Shorter, better-structured prompts beat longer ones for the same reason clear direction beats a rambling note.</p>

<h2>Why prompting works at all</h2>

<p>Because the model was trained on images paired with text and language paired with language, description and result are already linked inside it. A prompt is not a command. It is a <em>conditioning signal</em> — a nudge that shifts where in latent space the model searches.</p>

<p>That single reframe fixes most bad prompting habits:</p>

<ul>
  <li>Adjectives that mean nothing statistically ("beautiful", "amazing", "8k masterpiece") do almost nothing, because they were attached to everything in the training data.</li>
  <li>Terms with a specific visual footprint ("35mm", "sodium vapour street light", "shot on Ektachrome", "shallow depth of field") do a lot, because they were attached to a consistent look.</li>
  <li>Naming a genre, a movement, or a named practitioner's era is a strong lever — and one worth using thoughtfully, because it borrows an identifiable signature rather than building your own.</li>
</ul>

<h2>Why models hallucinate</h2>

<p>Because they are always doing exactly one thing: producing a plausible continuation. There is no separate module that checks whether the result is true, physically possible, or internally consistent. A six-fingered hand is not a bug in a hand-drawing routine — there is no hand-drawing routine. It is a region of the output where plausibility was locally satisfied and globally violated.</p>

<div class="note">
  <span class="note-label">The instinct to build</span>
  <p>Stop asking "why did it get this wrong?" and start asking "was this the most plausible continuation of what I gave it?" Nearly always, it was. Fix the input, not the model.</p>
</div>
`,

  body: `
<p class="lede">There is a version of this chapter that lists today's tools and is wrong within a year. This is not that chapter. What follows is a set of questions that will still classify tools that do not exist yet.</p>

<h2>Four questions that classify anything</h2>

<div class="defs">
  <dl class="def"><dt>1. Who made the model?</dt><dd>A frontier lab, a specialist studio, or an open-source community. This predicts capability, cost and how fast it will change.</dd></dl>
  <dl class="def"><dt>2. Can you have the weights?</dt><dd>Closed (API access only), or open weights (downloadable, runnable, fine-tunable). This predicts control, privacy and cost floor.</dd></dl>
  <dl class="def"><dt>3. Is this a model or an interface?</dt><dd>The thing that generates, or the product wrapped around it. Many tools you pay for are interfaces over models they did not train.</dd></dl>
  <dl class="def"><dt>4. Where does it run?</dt><dd>Their GPUs (cloud) or yours (local). This decides cost structure, speed, privacy and content policy.</dd></dl>
</div>

<p>Run those four questions on any product and you will know what it is, what it will cost you, and how badly you will be hurt when it changes.</p>

<div class="widget" data-widget="classify"></div>

<h2>Closed-source and open-weights</h2>

<p>The split is not ideological, it is operational.</p>

<p><strong>Closed models</strong> are served through an API or a product. You get the current version, the provider's content policy, and no ability to run it when they change the pricing or retire it. In exchange you usually get the strongest available quality with zero setup. Most frontier video sits here.</p>

<p><strong>Open-weights models</strong> can be downloaded and run. You get control, privacy, unlimited use at the cost of your own hardware, and the ability to fine-tune on your own material. In exchange you get setup work, hardware limits and, typically, a step behind the frontier on raw quality — though the gap is smaller than most people assume, and open-weights image generation is genuinely competitive.</p>

<p>Note that "open weights" and "open source" are routinely conflated. Open weights means you can download and run the parameters, usually under a licence with conditions. It rarely means the training data or full pipeline is public.</p>

<h2>Frontier labs, specialists, aggregators, interfaces</h2>

<div class="defs">
  <dl class="def"><dt>Frontier labs</dt><dd>Organisations training the largest general models — OpenAI, Google DeepMind, Anthropic and their peers. Broad capability, heavy research investment, fast movement.</dd></dl>
  <dl class="def"><dt>Specialist model studios</dt><dd>Teams training for one medium and pushing it hard: Black Forest Labs on images, Kuaishou on video, ElevenLabs on voice, Suno and Udio on music.</dd></dl>
  <dl class="def"><dt>Aggregators</dt><dd>Platforms that host or route to many models behind one account and one bill — OpenRouter for text, Fal and Replicate for media. Ideal for comparison, and for not rebuilding your integration every time you switch.</dd></dl>
  <dl class="def"><dt>Interfaces</dt><dd>Products whose value is the workflow around generation: controls, presets, timelines, asset management. Higgsfield's motion controls, Runway's editing surface, Krea's canvas. Some train models too; many do not.</dd></dl>
</div>

<p>The provider-versus-interface distinction is the one that catches people out. If a tool is an interface over other people's models, then its quality moves when their models move, its pricing carries a margin on top of the underlying cost, and the thing you are really buying is control and convenience. That can be well worth paying for — an interface that gives you repeatable camera moves may beat raw API access for actual production work. Just know which one you are buying.</p>

<h2>A field guide, with an expiry date</h2>

<p>Read this as worked examples of the classification, not as a shopping list. Specific capabilities will have moved by the time you read it; the categories will not.</p>

<div class="defs">
  <dl class="def"><dt>Veo</dt><dd>Google's video model family. Frontier lab, closed, cloud, reached through Google's own surfaces and APIs. Strong on prompt adherence and native audio.</dd></dl>
  <dl class="def"><dt>Kling</dt><dd>Kuaishou's video model. Specialist studio, closed, cloud. Noted for motion quality and human movement.</dd></dl>
  <dl class="def"><dt>Runway</dt><dd>Both a model studio and an interface — its own video models plus an editing environment. Judge the two separately.</dd></dl>
  <dl class="def"><dt>Higgsfield</dt><dd>Primarily an interface layer: curated motion and camera controls over multiple underlying video models. You are buying control and presets.</dd></dl>
  <dl class="def"><dt>Midjourney</dt><dd>Image model plus its own interface, closed, cloud. A strong aesthetic default — which is both its appeal and the thing to push against.</dd></dl>
  <dl class="def"><dt>Flux</dt><dd>Black Forest Labs' image family. Specialist studio, with open-weight variants you can run and fine-tune, plus hosted versions.</dd></dl>
  <dl class="def"><dt>Ideogram</dt><dd>Image model with a specialism in legible typography — the classic weak point of image generation.</dd></dl>
  <dl class="def"><dt>OpenAI</dt><dd>Frontier lab across text, image, video and voice; reached through its products and API. Closed, cloud.</dd></dl>
</div>

<div class="note">
  <span class="note-label">Practical stance</span>
  <p>Have a default for each job and a known alternative behind it. Keep your assets and your project files portable, and never let a pipeline depend on one vendor's proprietary format. Tool loyalty is a liability in a field that reprices itself every quarter.</p>
</div>

  thesis: 'Amateurs ask what a tool costs. Professionals ask what a finished minute costs, including the failures.',

<p class="lede">The single most common way an AI project goes wrong financially is not overspending on a subscription. It is discovering in week three that the shot you need takes eleven attempts, and that you budgeted for one.</p>

<p>Cost in generative media is not a price list. It is a function of your yield rate — how many generations it takes you to get a keeper — and yield is a skill, which means it improves.</p>

<h2>The units</h2>

<div class="defs">
  <dl class="def"><dt>Token</dt><dd>The unit language models bill in — roughly three-quarters of a word. You pay separately for input and output, and output is usually several times more expensive.</dd></dl>
  <dl class="def"><dt>Credit</dt><dd>A platform's abstraction over compute. Convenient for them, opaque for you. Always convert credits into a real currency per second of usable output before comparing anything.</dd></dl>
  <dl class="def"><dt>GPU-second</dt><dd>What everything actually costs underneath. Renting a high-end accelerator is priced by the hour; every generation is a slice of that hour.</dd></dl>
  <dl class="def"><dt>Yield rate</dt><dd>Usable outputs ÷ total generations. The number that actually determines your budget, and the only one on this list you control.</dd></dl>
</div>

<h2>Why video is so much more expensive than image</h2>

<p>Not because video companies are greedy. Because of what the machine is being asked to do.</p>

<ul>
  <li><strong>Frames multiply.</strong> A five-second clip at 24fps is 120 images — and they cannot be generated independently, because they must agree with each other.</li>
  <li><strong>Coherence costs more than pixels.</strong> The model must hold the subject, lighting and physics stable across time. That temporal consistency is the expensive part, not the resolution.</li>
  <li><strong>Attempts are longer.</strong> An image comes back in seconds, so a bad one costs you seconds. A video generation can take minutes, so an unusable one costs real time as well as real money.</li>
</ul>

<p>Expect video to cost one to three orders of magnitude more than stills per attempt. This is why the professional pattern is to <em>resolve everything you can in images first</em>. Every decision about framing, character, palette and light that you settle in a cheap still is a decision you are not paying to discover in an expensive clip.</p>

<p class="pull">Solve it in stills. Move it in video. The order is the budget.</p>

<div class="widget" data-widget="budget"></div>

<h2>Cloud or local</h2>

<div class="defs">
  <dl class="def"><dt>Cloud inference</dt><dd>Zero setup, frontier quality, pay per generation. Costs scale linearly with use, forever. Your content passes through someone else's policy and infrastructure.</dd></dl>
  <dl class="def"><dt>Local inference</dt><dd>A large fixed cost in hardware and hours, then near-zero marginal cost. Full privacy, no content policy, complete control, fine-tuning on your own material — at a step behind the frontier and with real maintenance overhead.</dd></dl>
</div>

<p>The crossover is not about ideology or even really about money. Go local when you need volume, privacy, or a bespoke fine-tune on your own assets. Stay in the cloud when you need the best available quality on a deadline, or when your usage is bursty — which for most freelance and studio work, it is.</p>

<p>A pragmatic default: cloud for finals and anything client-facing, local for exploration, upscaling and the grinding repetitive passes where quantity beats peak quality.</p>

<h2>How to price a job</h2>

<p>Cost the deliverable, never the tool. Work backwards:</p>

<ol>
  <li>Finished duration, in seconds.</li>
  <li>Number of distinct shots, and the average length of each.</li>
  <li>Your honest yield rate for this kind of shot — for anything unfamiliar, assume worse than you would like.</li>
  <li>Generation cost per attempt, converted to real currency.</li>
  <li>Multiply, then add a revision allowance. Client work without a revision allowance is not a budget, it is a wish.</li>
</ol>

<div class="note">
  <span class="note-label">The number that saves you</span>
  <p>Track your own yield rate per shot type. Once you know that character dialogue takes you fourteen attempts and a landscape plate takes two, you can quote generative work as reliably as a shoot — and that reliability is what a client is actually buying.</p>
</div>

<p class="lede">"What's the best AI video tool?" is the most-asked and least-useful question in this field. It is the equivalent of asking what the best lens is. The honest answer is another question: for what shot?</p>

<p>What follows is a map of jobs. When you evaluate a model, you are testing it against one of these jobs — not against a general notion of quality.</p>

<h2>Image generation</h2>

<div class="defs">
  <dl class="def"><dt>Photorealism</dt><dd>Judge skin, hands, eyes, fabric and — above all — believable light. Most models fail on lighting logic long before they fail on texture.</dd></dl>
  <dl class="def"><dt>Illustration and stylisation</dt><dd>Judge whether the style holds together across a set, not whether one frame looks nice. A model with a strong aesthetic default is fast when you want its look and a fight when you do not.</dd></dl>
  <dl class="def"><dt>Typography</dt><dd>A genuine specialism. Most image models still mangle text; a few are built for it. If your work needs legible words in frame, this alone decides the tool.</dd></dl>
  <dl class="def"><dt>Product imagery</dt><dd>Requires accuracy to a real object, which usually means reference conditioning or inpainting rather than pure generation.</dd></dl>
</div>

<h2>Video</h2>

<div class="defs">
  <dl class="def"><dt>Cinematic realism</dt><dd>Watch the physics. Cloth, hair, water and crowds are where models break. Watch a clip twice before you accept it.</dd></dl>
  <dl class="def"><dt>Animation</dt><dd>Different demands entirely — line stability, held frames, deliberate motion rather than smooth interpolation.</dd></dl>
  <dl class="def"><dt>Character consistency</dt><dd>The hardest requirement in the medium. Ask directly whether the tool supports reference conditioning or character references; without it, cuts between shots will not hold.</dd></dl>
  <dl class="def"><dt>Motion quality</dt><dd>Separate <em>camera</em> motion from <em>subject</em> motion. Some models move the camera beautifully and can barely animate a person; some are the reverse.</dd></dl>
  <dl class="def"><dt>Prompt adherence</dt><dd>Does it do what you asked, or something adjacent and pretty? For directed work, adherence beats raw beauty every time.</dd></dl>
</div>

<div class="widget" data-widget="picker"></div>

<h2>Voice, speech and music</h2>

<div class="defs">
  <dl class="def"><dt>Narration</dt><dd>Judge on breath, pacing and restraint. Most synthetic narration fails by over-performing.</dd></dl>
  <dl class="def"><dt>Dialogue</dt><dd>Much harder than narration: it needs emotional range and believable interaction between lines.</dd></dl>
  <dl class="def"><dt>Voice cloning</dt><dd>Technically routine, ethically not. Use it on your own voice, or with explicit written consent. There is no third option that survives scrutiny.</dd></dl>
  <dl class="def"><dt>Text-to-speech vs voice conversion</dt><dd>TTS generates from text. Conversion takes a real performance and changes the voice — which keeps human timing, and is usually the better tool for anything with acting in it.</dd></dl>
  <dl class="def"><dt>Music</dt><dd>Scoring to picture, ambient beds, and full songs with lyrics are three different jobs. Check licensing terms for commercial use before you fall in love with a cue.</dd></dl>
</div>

<h2>Writing</h2>

<p>Language models are strongest at the parts of writing that are not the writing: ideation, structural interrogation, coverage, alternate versions, and merciless editing. They are weakest at voice, which is exactly the part you should not be outsourcing anyway.</p>

<p>The most valuable use is as a ruthless editor. "Cut this to thirty seconds without losing the turn" is a request models are unusually good at, and one most writers are unusually bad at.</p>

<h2>How to actually evaluate</h2>

<p>Build a personal benchmark. Not a mood board — a test set. Three to five prompts you keep, unchanged, forever:</p>

<ul>
  <li>One that needs specific lighting.</li>
  <li>One that needs a consistent character.</li>
  <li>One with motion that could break — hands, water, crowd, cloth.</li>
  <li>One in your actual house style.</li>
</ul>

<p>Run every new model against the same set. Ten minutes, real comparison, no marketing. This is how you form your own view instead of adopting someone else's.</p>

<div class="note">

  <p>Every hour spent mastering a tool's quirks is an hour invested in something with a short half-life. Master the <em>job</em>, keep the tools swappable, and treat a favourite model as a current default rather than an identity.</p>
</div>

  title: 'The Iteration Loop',
  thesis: 'This is the single biggest skill in the medium, and almost nobody teaches it. Professionals do not write better prompts. They run a better loop.',

<p class="lede">Watch an amateur work with these tools and you will see the same behaviour every time: one prompt, one result, disappointment, a small tweak to the prompt, repeat. It feels like refinement. It is a slot machine.</p>

<p>Watch a professional and you will see something that looks much more like a photo shoot. Volume first, then selection, then deliberate variation on what survived. The prompt is not the craft. The loop is the craft.</p>

<div class="widget" data-widget="funnel"></div>

<h2>The five passes</h2>

<div class="defs">
  <dl class="def"><dt>1 · Diverge</dt><dd>Generate wide and cheap. Many variations, deliberately different directions — not the same idea eight times. You are mapping the possibility space, not making the shot.</dd></dl>
  <dl class="def"><dt>2 · Select</dt><dd>Ruthlessly. Six survive, at most. And write down <em>why</em> each one survived, because that sentence is the actual product of this pass.</dd></dl>
  <dl class="def"><dt>3 · Converge</dt><dd>Now regenerate around the survivors — same seed family, small deliberate changes, one variable at a time.</dd></dl>
  <dl class="def"><dt>4 · Repair</dt><dd>Fix rather than reroll. Inpaint the hand, crop the composition, correct the colour, composite two takes. A near-miss is usually cheaper to repair than to regenerate.</dd></dl>
  <dl class="def"><dt>5 · Finish</dt><dd>Upscale, grade, and integrate into the sequence. Only now — upscaling a shot you have not committed to is money set on fire.</dd></dl>
</div>

<h2>Diverge before you converge</h2>

<p>The mistake that costs the most time is converging too early: falling for the third image you generated and spending two hours trying to perfect it, when generation eleven would have been better than anything that image could become.</p>

<p>Generate wide first, with genuinely different approaches — different framing, different light, different time of day, different emotional register. You are not looking for the shot yet. You are finding out what this idea can look like.</p>

<h2>Change one variable at a time</h2>

<p>Once you are converging, discipline matters. If you change the lighting, the lens and the wardrobe all at once and the result is worse, you have learned nothing. This is the difference between iteration and thrashing.</p>

<p>Hold the seed. Change one term. Observe. This is a controlled experiment, and it is also the only way to build real intuition about what a given model responds to.</p>

<h2>Selection is the skill</h2>

<p>Generating a hundred images is easy. Choosing six is hard, and choosing six <em>for stated reasons</em> is what separates a director from someone with a subscription.</p>

<p>Two habits make this dramatically better:</p>

<ul>
  <li><strong>Select against the brief, not against your mood.</strong> The question is never "do I like this?" — it is "does this do the job this shot has to do in the sequence?"</li>
  <li><strong>Look at them small and together.</strong> Contact-sheet your outputs. A frame that only works at full screen will not work in a cut, and problems of composition are far more visible at thumbnail size.</li>
</ul>

<h2>Kill criteria</h2>

<p>Decide in advance when to stop pursuing a shot. Something like: <em>if I have not got it in twenty generations, the prompt is not the problem — the shot is wrong, or the model cannot do it.</em></p>

<p>Without a kill criterion you will spend forty percent of your budget on the one shot that was never going to work, which is a mistake that predates AI by about a century. The fix is the same as it has always been: change the shot, change the tool, or cut the shot.</p>

<div class="note">
  <span class="note-label">Log as you go</span>
  <p>Keep a running note of prompt, seed, model, and a one-line verdict. It feels like admin for about a day, and then it becomes the most valuable asset you own — your own empirical record of what works, which no model release can take from you.</p>
</div>

{
  id: 'story',
  part: 3,
  n: 7,
  title: 'Story Before Software',
  thesis: 'The reason most AI films are boring has nothing to do with AI. They are boring because nothing is at stake.',

  body: `
<p class="lede">Scroll any feed of AI film work and you will find beautiful footage attached to nothing. A woman walks through neon rain. A figure stands on a cliff at golden hour. An astronaut looks at something we never see. It is technically impressive and emotionally inert, and the reason is always the same: it was generated, not written.</p>

<p>These tools are extraordinarily good at producing images that <em>look like</em> a moment from a film. They are useless at producing the reason that moment matters. That reason has to come from you, and it has to exist before you open anything.</p>

<h2>The minimum viable story</h2>

<p>You do not need three acts to make forty seconds work. You need something to change. The smallest complete unit is:</p>

<div class="defs">
  <dl class="def"><dt>Someone</dt><dd>A specific character, not a mood. "A woman" is not a character. "A woman who has already decided to leave" is.</dd></dl>
  <dl class="def"><dt>Wants something</dt><dd>Concrete and visible. Desire is what makes an audience lean in.</dd></dl>
  <dl class="def"><dt>Something is in the way</dt><dd>No obstacle, no tension. No tension, no attention.</dd></dl>
  <dl class="def"><dt>Something changes</dt><dd>The turn. If the end state equals the start state, you made a moving photograph.</dd></dl>
</div>

<p>Test it: can you say what your piece is about in one sentence containing a <em>but</em> or a <em>because</em>? If the only sentence available is "it's about a woman in a rainy city", you do not have a story yet. You have an environment.</p>

<div class="widget" data-widget="spine"></div>

<h2>Emotional hooks</h2>

<p>The first three seconds decide whether the rest exists. In practice a hook is one of a small number of things:</p>

<ul>
  <li><strong>A question the image raises.</strong> Something is visibly wrong or unexplained, and we want to know why.</li>
  <li><strong>A face doing something specific.</strong> The most reliable attention magnet ever discovered, and the thing generative video finds hardest — which is exactly why it is worth the effort.</li>
  <li><strong>A rupture of expectation.</strong> Something familiar behaving incorrectly.</li>
  <li><strong>Motion with intent.</strong> Not camera drift. Movement that implies purpose.</li>
</ul>

<p>Notice that none of these require a big budget, and all of them require a decision.</p>

<h2>Character in forty seconds</h2>

<p>You will not get an arc. You can get <em>specificity</em>, which reads as character almost immediately: one concrete detail, one gesture, one contradiction. A soldier who is gentle with a small object. A wealthy man in shoes that do not fit. Specificity is also a gift to the prompt — it gives the model something to hold on to besides an archetype, and archetypes are precisely what these models default to.</p>

<p class="pull">Vague in, generic out. The model's blandness is usually a mirror of the brief.</p>

<h2>Mood is not a story, but it is a contract</h2>

<p>Establishing mood in the first shot sets an expectation the rest of the piece must honour or deliberately break. Decide the emotional register before you generate anything: is this warm or cold, still or restless, observed or subjective? Written down in three words, this decision resolves a hundred later ones about lens, light and cut length.</p>

<h2>References, and how to use them honestly</h2>

<p>Gather references before you write prompts — and gather them widely: film, photography, painting, architecture, documentary, your own footage. Then do the part most people skip: <strong>write down what you are actually taking.</strong></p>

<p>"This Roger Deakins frame" is not a reference. "Single hard source from frame left, everything else falling into black, subject small in the frame" is a reference. The first borrows an identity. The second borrows a technique — which you can then apply to your own subject in your own way, and which, incidentally, is the version that translates into a prompt.</p>

<div class="note">
  <span class="note-label">The order that works</span>
  <p>Intent, then story, then look, then tools. Every time you find yourself unable to decide what to generate, you have skipped a step above it. Go back one level.</p>
</div>

<p class="lede">Here is the uncomfortable thing about prompting: the model already knows what a 35mm lens looks like, what sodium vapour does to skin, and how a dolly move differs from a zoom. You are the one who does not. Every gap in your visual vocabulary is a control you cannot reach.</p>

<p>This chapter is a hundred years of cinematography compressed into the terms that actually move a generation. Learn these and your prompts stop being descriptions and start being direction.</p>

<h2>Composition</h2>

<div class="defs">
  <dl class="def"><dt>Shot size</dt><dd>Extreme wide, wide, medium, close, extreme close. Size is an emotional decision before it is a technical one: distance reads as objectivity, closeness as intimacy or threat.</dd></dl>
  <dl class="def"><dt>Negative space</dt><dd>Empty area around the subject. Generous space isolates; tight space suffocates. One of the strongest and most underused controls in a prompt.</dd></dl>
  <dl class="def"><dt>Balance</dt><dd>Symmetry reads as control, order, sometimes menace. Asymmetry reads as unease or naturalism.</dd></dl>
  <dl class="def"><dt>Depth</dt><dd>Foreground, midground, background. Layers are what separate a photograph of a place from a frame with an interior. Ask for a foreground element explicitly — models rarely add one unprompted.</dd></dl>
  <dl class="def"><dt>Eye line and headroom</dt><dd>Where the subject looks, and how much space sits above them. Both are directable, and both quietly signal competence or its absence.</dd></dl>
</div>

<h2>Lens</h2>

<p>Focal length is not zoom. It changes the geometry of the world and therefore its psychology.</p>

<div class="defs">
  <dl class="def"><dt>14–24mm</dt><dd>Wide. Exaggerated depth, curved edges, space feels vast and slightly unstable. Faces distort — usually unflattering, occasionally the point.</dd></dl>
  <dl class="def"><dt>35mm</dt><dd>The naturalistic documentary lens. Close to how we remember seeing.</dd></dl>
  <dl class="def"><dt>50mm</dt><dd>Neutral, roughly human perspective. Honest and unshowy.</dd></dl>
  <dl class="def"><dt>85mm</dt><dd>The portrait lens. Flattering compression, background falls away, intimacy.</dd></dl>
  <dl class="def"><dt>135mm+</dt><dd>Long. Space compresses, layers stack, the subject feels observed or hunted. Ideal for surveillance and for crowds.</dd></dl>
</div>

<p>Aperture rides alongside: shallow depth of field isolates and glamorises, deep focus keeps the world present and implicates the subject in it. "Everything sharp from the foreground bottle to the far wall" is a different film from "eyes sharp, everything else dissolved".</p>

<div class="widget" data-widget="shot"></div>

<h2>Light</h2>

<p>If you learn only one thing in this chapter, learn to describe light. It is the single largest determinant of whether a generated frame looks like a film or like a render.</p>

<div class="defs">
  <dl class="def"><dt>Quality</dt><dd>Hard light (small source) gives sharp-edged shadows, drama, cruelty. Soft light (large or diffused source) gives gradual falloff, gentleness, safety.</dd></dl>
  <dl class="def"><dt>Direction</dt><dd>Front is flat and honest. Side sculpts. Back separates and mythologises. Under-lighting is unnatural and immediately unsettling — we almost never see faces lit from below.</dd></dl>
  <dl class="def"><dt>Ratio</dt><dd>The gap between lit and shadow side. Low contrast reads as calm and commercial; high contrast reads as tense and cinematic.</dd></dl>
  <dl class="def"><dt>Colour and source</dt><dd>Name a real source and the model gives you its real behaviour: tungsten practicals, sodium street lamp, fluorescent office ceiling, firelight, overcast window, single neon sign. This is the highest-yield substitution you can make in any prompt.</dd></dl>
  <dl class="def"><dt>Motivation</dt><dd>Every light in frame should have a plausible source. Unmotivated light is the most common tell in amateur generative work — beautiful rim light in a scene with no possible source behind the subject.</dd></dl>
</div>

<h2>Movement</h2>

<p>Camera movement is grammar, not decoration. Each move means something:</p>

<div class="defs">
  <dl class="def"><dt>Static</dt><dd>Observation. Confidence. Lets performance carry the shot — and by far the most reliable choice in generative video, where every movement is a chance for the model to break.</dd></dl>
  <dl class="def"><dt>Pan / tilt</dt><dd>The camera turns in place. Reveals, follows, connects two things in one space.</dd></dl>
  <dl class="def"><dt>Dolly / track</dt><dd>The camera travels. Push in to intensify; pull out to isolate or release.</dd></dl>
  <dl class="def"><dt>Handheld</dt><dd>Immediacy, subjectivity, unease. Easy to overdo — and often a mask for a shot with no idea.</dd></dl>
  <dl class="def"><dt>Crane / drone</dt><dd>Scale and god's-eye perspective. The default AI move, which is precisely why it now reads as a cliché.</dd></dl>
</div>

<p class="pull">If you cannot say what a camera move means, do not make it. Stillness is a choice; drift is an accident.</p>

<h2>Colour</h2>

<p>Decide a palette before you generate, in the same way a production designer would: a dominant, a supporting and an accent. Then hold it across the whole piece. The most common failure in AI sequences is not ugly colour — it is <em>inconsistent</em> colour, twelve shots each individually attractive and collectively incoherent. A grade at the end can rescue a lot of this, but only if the source frames are within reach of each other.</p>

<div class="note">
  <span class="note-label">Prompt substitution drill</span>
  <p>Take one of your prompts and replace every mood word with a technical one. "Moody" becomes "single hard key from frame left, deep shadow, 4:1 ratio". "Cinematic" becomes "85mm, shallow depth of field, backlit haze". Run both. The difference is the chapter.</p>
</div>

  body: `
<p class="lede">Two people using the identical model, the identical prompt structure and the identical budget will produce work of wildly different quality. The variable is taste — and unlike everything else in this book, no release note will ever hand it to you.</p>

<p>Taste is not innate and it is not mystical. It is pattern recognition built through deliberate exposure, plus the honesty to apply it to your own work.</p>

<h2>Why most AI work looks amateur</h2>

<p>It is rarely one big failure. It is a stack of small tells:</p>

<ul>
  <li><strong>Default aesthetics.</strong> Whatever the model does when you do not push it — over-saturated, over-lit, over-detailed, centre-weighted. If your frame looks like the platform's homepage, you have shipped their taste, not yours.</li>
  <li><strong>Unmotivated everything.</strong> Rim light with no source. Haze with no reason. Rain that does not wet anything.</li>
  <li><strong>Detail without hierarchy.</strong> Every surface equally busy, so the eye has nowhere to land. Real frames have quiet regions.</li>
  <li><strong>Drift.</strong> Faces, palettes and light that change between shots. Nothing announces "made by a machine, unsupervised" faster.</li>
  <li><strong>Motion for its own sake.</strong> The endless slow push-in on a subject doing nothing.</li>
  <li><strong>No sound design.</strong> A library track and nothing else. Audio is half the medium and the fastest available upgrade.</li>
  <li><strong>Too long.</strong> Almost every AI short would improve at sixty percent of its length.</li>
</ul>

<div class="widget" data-widget="cliche"></div>

<h2>Clichés move</h2>

<p>Today's list will date, and the fact that it dates is the lesson. Currently exhausted: the neon-rain cyberpunk alley. The drone rise over a fantasy landscape. The astronaut on an alien shore. The slow-motion powder explosion. The photoreal woman with perfect skin looking just past camera. The orange-and-teal grade applied to everything.</p>

<p>These were all striking the first hundred times. They became clichés because they are what the models do most easily — the centre of gravity of the training data. Which gives you a durable rule: <strong>whatever the model produces most eagerly is what everyone else is also producing.</strong> The interesting work lives slightly off that centre.</p>

<h2>Building judgment on purpose</h2>

<div class="defs">
  <dl class="def"><dt>Study outside your medium</dt><dd>Painting, photography, architecture, dance. Everyone in your field is looking at the same films and the same feed. Your advantage comes from what you look at that they do not.</dd></dl>
  <dl class="def"><dt>Say why, every time</dt><dd>Never let "I like it" stand. Force one sentence of reason. Repeated a few hundred times, this is how taste becomes articulable, and articulable taste is the thing you can direct with.</dd></dl>
  <dl class="def"><dt>Study things you dislike</dt><dd>Understanding why something fails is more instructive than admiring success, and considerably less flattering.</dd></dl>
  <dl class="def"><dt>Keep a reference library</dt><dd>Not a mood board of pretty images. An organised set of solutions to problems: how a scene handled an entrance, how a grade held two colours apart.</dd></dl>
  <dl class="def"><dt>Publish and watch</dt><dd>Nothing sharpens judgment like the discomfort of seeing your own work in public a month later.</dd></dl>
</div>

<h2>Knowing when to stop</h2>

<p>Two opposite failures, and you will have both:</p>

<p><strong>Stopping too early</strong> — accepting the first result that clears "good enough". The near-miss you talked yourself into is visible to everyone else.</p>

<p><strong>Stopping too late</strong> — iterating past the point of improvement, sanding a piece until it is smooth and dead. Everything technically resolved and nothing alive.</p>

<p>The practical test: <em>can you name the specific thing the next iteration will fix?</em> If yes, keep going. If your answer is a vague "it could be better", you are finished — you have run out of judgment on this piece, and further work is noise.</p>

<p class="pull">Taste is knowing which of forty is the good one. Everything else in this book is logistics.</p>

<div class="note">
  <span class="note-label">The rough edge</span>
  <p>Perfectly clean AI output reads as synthetic. Grain, a slight imperfection in the framing, an unresolved corner, an honest cut — these read as made by a person. Do not sand every edge off. The tells you leave in deliberately are style; the ones you leave in accidentally are not.</p>
</div>

<p class="lede">This is the deliverable chapter for Part III. Everything before it was thinking. This is where thinking becomes a document — and the document is what stops week three from being a slow argument with yourself about what you were making.</p>

<h2>Idea generation, done properly</h2>

<p>The failure mode is picking your first idea because it arrived first. Generate at scale — twenty premises, ten of them deliberately bad — then apply real selection pressure. Useful prompts to yourself:</p>

<ul>
  <li>What is the version of this that could only be made now, with these tools?</li>
  <li>What is the version that would be genuinely hard to shoot conventionally? (That is where AI earns its place rather than imitating a shoot.)</li>
  <li>What is the emotional truth here — and would it survive being made badly?</li>
  <li>What would I have to be brave to include?</li>
</ul>

<p>A language model is a genuinely good partner for this pass, on one condition: use it to <em>interrogate</em> your idea, not to supply one. "Give me twenty film ideas" produces twenty average ideas. "Here is my premise — attack it, find the cliché in it, tell me what is missing" produces something useful.</p>

<h2>The creative brief</h2>

<p>One page. If it does not fit on one page, the concept is not resolved yet.</p>

<div class="defs">
  <dl class="def"><dt>Premise</dt><dd>One sentence with a "but" or a "because".</dd></dl>
  <dl class="def"><dt>Audience</dt><dd>Who is this for, and where will they see it? A phone in a feed and a screening room are different films.</dd></dl>
  <dl class="def"><dt>Emotional target</dt><dd>What should someone feel at the end? Three words, agreed before anything is generated.</dd></dl>
  <dl class="def"><dt>Visual direction</dt><dd>Palette, lens language, light approach, texture. Technique notes, not adjectives.</dd></dl>
  <dl class="def"><dt>Duration and format</dt><dd>Length, aspect ratio, delivery specs. These constrain everything downstream, so decide them first.</dd></dl>
  <dl class="def"><dt>Constraints</dt><dd>Budget, deadline, what is explicitly out of scope. Constraints written down are protection; constraints in your head are future arguments.</dd></dl>
</div>

<div class="widget" data-widget="brief"></div>

<h2>Moodboards that do work</h2>

<p>Most moodboards are a folder of pretty pictures that make everyone feel good and decide nothing. A working moodboard is <em>annotated and sorted by purpose</em>:</p>

<ul>
  <li><strong>Light</strong> — how scenes are lit, nothing else.</li>
  <li><strong>Palette</strong> — colour relationships, ideally with the actual swatches pulled.</li>
  <li><strong>Framing</strong> — composition and shot sizes.</li>
  <li><strong>Texture</strong> — grain, surface, film stock, the material feel.</li>
  <li><strong>Character</strong> — faces, wardrobe, silhouette, physical presence.</li>
</ul>

<p>Each image carries one line: what am I taking from this? That line is what becomes prompt language later, which means an annotated moodboard is not documentation — it is the raw material of Chapter 12.</p>

<h2>World building</h2>

<p>Even a thirty-second spot has a world, and the world needs rules — because consistency across shots is a decision, not a happy accident.</p>

<ul>
  <li>What is the light source logic of this place, and what time is it?</li>
  <li>What is the technology and material level? What is this world made of?</li>
  <li>What is the weather and the season? What is on the ground?</li>
  <li>What colours exist here, and — just as importantly — what colours do not?</li>
</ul>

<p>Write these as a short list of rules. When a generation violates them, you now have grounds to reject it that are not "hmm, not quite".</p>

<h2>Style frames</h2>

<p>Three to five key images that define the look, made before production begins. Not shots from the film — the visual thesis of the film. Everything generated later gets judged against them, and every collaborator and client aligns on them.</p>

<p>This is also the moment where AI is unambiguously superior to the old process: style frames used to cost days of illustration. Now they cost an afternoon, so there is no defensible reason to skip them.</p>

<h2>The shot list</h2>

<p>The bridge from concept to production. For every shot: number, description, shot size, lens, camera movement, light, duration, and the audio underneath it. Do this before generating anything and you will discover — cheaply, on paper — that you have four shots doing the same job, or no establishing shot, or a sequence that cannot cut together.</p>

<div class="note">
  <span class="note-label">The concept is a contract</span>
  <p>When you are forty generations deep and lost, the brief is what tells you whether an output is right. Without it, every generation looks equally plausible and you will drift toward whatever the model does most easily — which, as Chapter 9 established, is exactly where everyone else already is.</p>
</div>
