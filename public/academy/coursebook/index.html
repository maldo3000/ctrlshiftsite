  body: `
<p class="lede">A conventional script assumes a crew that can shoot anything you write. Generative production has different strengths and different breaking points, and writing to them is not a compromise — it is the same discipline as writing for the stage rather than the screen.</p>

<h2>Write to the grain</h2>

<div class="defs">
  <dl class="def"><dt>Think in shots, not scenes</dt><dd>Most models generate a few seconds at a time. Write in units that match — each beat is a shot you can actually make.</dd></dl>
  <dl class="def"><dt>Minimise on-screen dialogue</dt><dd>Lip sync remains one of the hardest problems in the medium. Voiceover, overheard dialogue, dialogue over cutaways and reaction shots are all far more reliable — and often better filmmaking anyway.</dd></dl>
  <dl class="def"><dt>Limit character count</dt><dd>Every additional character multiplies your consistency problem. Two is manageable. Six is a project.</dd></dl>
  <dl class="def"><dt>Prefer single continuous actions</dt><dd>"She lifts the cup" generates. "She crosses the room, sits, pours a drink and turns to the door" does not — that is four shots pretending to be one.</dd></dl>
  <dl class="def"><dt>Design cuts as escapes</dt><dd>Cut before the model breaks. A cut is not a failure to hold a shot; it is grammar, and it is also a coherence budget you get to spend.</dd></dl>
</div>

<h2>Narration</h2>

<p>Voiceover is generative video's best friend. It carries story across shots that do not perfectly match, it explains what images cannot, and it is cheap to iterate.</p>

<p>Write it for the ear: short sentences, concrete nouns, no subordinate clauses stacked three deep. Read every line out loud — if you run out of breath, so will the voice model, and synthetic delivery exposes clumsy writing far more brutally than a good human read, which would have quietly fixed it for you.</p>

<p>The other rule is the old documentary one: <strong>do not narrate what the picture already says.</strong> Narration should add a layer the image cannot — context, interiority, contradiction. Words describing exactly what we can see is the fastest way to make a film feel like a corporate explainer.</p>

<div class="widget" data-widget="timing"></div>

<h2>Dialogue</h2>

<p>If you need it, keep lines short, and keep them off-camera where you can. A line delivered over a reaction shot, a hand, or an empty room is one you never have to lip sync. When you do need a talking face, generate the audio performance first and drive the visual from it — never the reverse.</p>

<h2>Storyboarding</h2>

<p>Storyboarding has become nearly free, which changes its role: it is now a thinking tool rather than a communication artefact. Generate rough frames for every shot early, lay them out in sequence, and read the film before you make it.</p>

<p>Read for the things a script hides: does this cut together? Are three consecutive shots the same size? Where does the eye go across a cut? Is there any variety in the rhythm? A sequence of eight beautiful medium shots is unwatchable, and you can only see that when you look at them in a row.</p>

<h2>Timing</h2>

<p>The numbers that make a script schedulable:</p>

<ul>
  <li>Narration runs about <strong>140–160 words per minute</strong> at a comfortable pace. Slower for gravity, faster for energy.</li>
  <li>A shot needs roughly <strong>1.5–2 seconds</strong> to read if it is simple, and 4+ if it carries new information or a performance.</li>
  <li>Social work runs faster than broadcast; a hook has about <strong>three seconds</strong> before the scroll wins.</li>
</ul>

<p>Write the timings into the script itself. A forty-second film with sixty seconds of narration in it is a problem you want to find at the writing stage, not in the edit.</p>

<div class="note">
  <span class="note-label">Write the script twice</span>
  <p>Once as the story you want, ignoring all constraints. Then once as the production plan, written to what you can actually generate. The gap between them is the honest list of what this medium costs you — and occasionally that gap contains a better film than the one you set out to make.</p>
</div>

  body: `
<p class="lede">This is the highest-leverage stage in the entire pipeline, and the one most people rush. Images are cheap and fast; video is expensive and slow. Every decision you push upstream into stills pays for itself several times over.</p>

<h2>Image prompting that works</h2>

<p>A reliable structure, roughly in order of importance:</p>

<ol>
  <li><strong>Subject</strong> — who or what, specifically.</li>
  <li><strong>Action or state</strong> — what they are doing.</li>
  <li><strong>Environment</strong> — where, with one concrete detail rather than a category.</li>
  <li><strong>Framing</strong> — shot size, angle, and any foreground element.</li>
  <li><strong>Lens</strong> — focal length and depth of field.</li>
  <li><strong>Light</strong> — quality, direction, named source.</li>
  <li><strong>Palette and texture</strong> — colour relationships, grain, stock.</li>
</ol>

<p>Front-load what matters. Attention is finite: the twentieth clause competes with the first, so put the essential things early and cut the ones that are decoration.</p>

<div class="widget" data-widget="prompt"></div>

<h2>Character consistency</h2>

<p>The defining technical problem of the medium. In rough order of reliability:</p>

<div class="defs">
  <dl class="def"><dt>Reference images</dt><dd>Most models now accept a character reference. Two or three good angles beat a paragraph of description every time.</dd></dl>
  <dl class="def"><dt>A fine-tune or LoRA</dt><dd>Train a small adapter on your character. The strongest option when you have the images and the project justifies the setup.</dd></dl>
  <dl class="def"><dt>Seed and prompt discipline</dt><dd>Same seed, identical character description, changed only in the parts that must change. Fragile, but free.</dd></dl>
  <dl class="def"><dt>Design around the problem</dt><dd>Distinctive silhouette, unmistakable wardrobe, a mask, a helmet, back-of-head shots, faces in shadow. Directors have been solving continuity this way since long before AI existed.</dd></dl>
</div>

<p>Build a character sheet before production: front, three-quarter, profile, full body, and one expression range. Then treat it as canon. Every generated frame gets checked against it, and drift gets caught on the day rather than in the edit.</p>

<h2>Style consistency</h2>

<p>Same discipline, applied to the world. Lock a style prompt fragment — the exact wording of your palette, light approach, lens language and texture — and reuse it verbatim across every shot. Do not improve it halfway through the project. A slightly better fragment that only applies to shots 9 to 14 is worse than a consistent one applied to all of them.</p>

<p>Also lock your model and version. A mid-project switch is a re-shoot in everything but name.</p>

<h2>Reference images</h2>

<p>Reference conditioning is the most underused lever available to most people. Depending on the tool you can condition on style, composition, character, depth or pose. "Match this composition, change the subject" is a far more precise instruction than any sentence you could write — and it is how you get the frame in your head rather than the frame the model prefers.</p>

<h2>Iterating on stills</h2>

<p>Run the loop from Chapter 6 here, hard. Diverge wide on the key frame for each shot. Select six. Converge. Repair rather than reroll — inpaint the hand, extend the frame, fix the sign, composite the good head onto the good body.</p>

<p>The output of this chapter is one approved frame per shot, checked against the style frames and the character sheet. That frame is not a preview. In the next chapter it becomes the literal first frame of your video generation, which means <em>the quality of your film is decided here.</em></p>

<div class="note">

{
  id: 'motion',
  part: 4,
  n: 13,
  title: 'Motion Generation',
  thesis: 'Image-to-video is not a feature. It is the reason your film has a chance of looking like it was directed.',
  outcome: 'Finished shots — generated, selected, repaired and upscaled.',
  terms: ['Image-to-video', 'Text-to-video', 'Temporal coherence', 'Motion prompt', 'Upscaling'],
  deliverable: 'Finished shots at delivery resolution, ready for the edit.',
  body: `
<p class="lede">You have an approved frame for every shot. Now you make them move — and the single most consequential decision here is the one you already made by having those frames at all.</p>

<h2>Image-to-video, almost always</h2>

<div class="defs">
  <dl class="def"><dt>Text-to-video</dt><dd>Describe a shot, receive a shot. Fast, but you are gambling on composition, character, palette and light all at once — and you cannot art-direct any of them.</dd></dl>
  <dl class="def"><dt>Image-to-video</dt><dd>Supply your approved frame and describe only the motion. Composition, character and light are already locked. You are directing one variable instead of six.</dd></dl>
</div>

<p>Use text-to-video for exploration and for shots where the specific frame does not matter. Use image-to-video for everything you actually intend to keep. This is the difference between hoping and directing.</p>

<h2>Motion prompting</h2>

<p>When the frame is fixed, the prompt is about movement only. Two things move: the camera, and the subject. Say both, separately, and say nothing else.</p>

<ul>
  <li><strong>Camera:</strong> static, slow push in, pull back, pan left, tilt up, tracking with subject, handheld drift.</li>
  <li><strong>Subject:</strong> the one action. "She turns her head toward the light." "Steam rises and drifts left."</li>
  <li><strong>Environment:</strong> ambient motion — rain, dust, fabric, water, crowd.</li>
  <li><strong>Speed:</strong> slow, deliberate, sudden. Models default to a slightly dreamlike drift unless told otherwise.</li>
</ul>

<p>Re-describing the scene in a motion prompt is the most common mistake at this stage. The frame is already there; every word you spend on what it looks like is a word competing with what it should do.</p>

<div class="widget" data-widget="motion"></div>

<h2>Camera movement, chosen not sprinkled</h2>

<p>Every move should mean something — and in generative video every move is also a risk, because motion is where coherence fails. A held frame with a genuine performance in it beats a drifting camera over nothing, every single time.</p>

<p>Combine moves at your peril. A push-in while panning while the subject walks is three coherence problems compounding, and the failure will usually land on a face.</p>

<h2>Iteration in motion</h2>

<p>Same loop, harsher economics. Because each attempt costs real money and real minutes, be more deliberate before you press generate and more decisive after:</p>

<ul>
  <li><strong>Watch twice.</strong> The first viewing catches the obvious. The second catches the hand that becomes a different hand.</li>
  <li><strong>Judge at speed and at frame rate.</strong> Some breaks only show at full speed; others only in a scrub.</li>
  <li><strong>Shorten instead of rerolling.</strong> If the last second breaks, cut the last second. You needed two seconds, not four.</li>
  <li><strong>Reframe instead of rerolling.</strong> A punch-in can crop the broken corner out entirely.</li>
  <li><strong>Change the frame, not the prompt.</strong> If a shot repeatedly fails, the input frame is usually the problem — an ambiguous pose, an occluded hand, a subject too small.</li>
</ul>

<h2>Upscaling and finishing</h2>

<p>Upscale last, and only what you have committed to in the edit. Generate at the model's native resolution, cut with those files, then upscale the shots that survived. Upscaling before the edit is spending money on footage you have not decided to use.</p>

<p>Be alert to what upscalers do: they invent detail. On skin and eyes that can drift into a plastic, over-sharpened look that reads as synthetic even when the underlying shot did not. Compare against the original at full size before accepting it, and dial back rather than maxing out.</p>

<div class="note">
  <span class="note-label">The rule that saves the most money</span>
  <p>Generate the shortest usable clip. You are cutting most of it anyway. A four-second generation for a shot that lives on screen for 1.8 seconds is you paying for two seconds of coherence risk you never needed.</p>
</div>

{
  id: 'audio',
  part: 4,

  title: 'Voice & Audio',
  thesis: 'Audio is half your film and roughly a tenth of the effort most people spend. That asymmetry is the cheapest advantage available to you.',

  terms: ['Ambience', 'Sound effect', 'Score', 'Voice conversion', 'Mix'],
  body: `
<p class="lede">Show someone excellent footage with weak sound and they will tell you the footage looks fake. Show them mediocre footage with excellent sound and they will tell you it looks great. Audio is where perceived production value actually lives — and it is the stage AI filmmakers most reliably skip.</p>

<h2>The layers</h2>

<div class="defs">
  <dl class="def"><dt>Ambience</dt><dd>The continuous bed. Room tone, traffic, wind, hum. Almost never consciously noticed and immediately missed — silence between sounds is the loudest tell that a scene is synthetic.</dd></dl>
  <dl class="def"><dt>Effects</dt><dd>Specific events tied to picture. Footsteps, doors, cloth, impacts. Two or three well-placed hits per shot sell physical reality.</dd></dl>
  <dl class="def"><dt>Voice</dt><dd>Narration or dialogue. Sits on top and usually leads the mix.</dd></dl>
  <dl class="def"><dt>Score</dt><dd>Emotional direction. The most abused layer — it should be supporting a feeling the picture already earns, not manufacturing one it has not.</dd></dl>
</div>

<div class="widget" data-widget="mix"></div>

<h2>Voiceover generation</h2>

<p>Synthetic voice is now good enough that the failures are almost entirely directorial:</p>

<ul>
  <li><strong>Cast before you generate.</strong> Age, texture, accent, and above all pace. Audition several voices on the same line, exactly as you would with humans.</li>
  <li><strong>Direct with punctuation.</strong> Line breaks, commas and full stops control breath and rhythm more effectively than any emotion setting.</li>
  <li><strong>Generate per line, not per script.</strong> Then you can re-roll one line without losing a good take on the rest.</li>
  <li><strong>Ask for less.</strong> The most common flaw in AI narration is over-performance. Flatter reads almost always cut better under picture.</li>
  <li><strong>Edit the audio.</strong> Trim breaths, adjust gaps, nudge timing against picture. Ten minutes of this separates convincing from uncanny.</li>
</ul>

<p>Where a performance matters, consider <strong>voice conversion</strong> instead: record the read yourself with the timing and emphasis you want, then convert the voice. You keep human phrasing, which is the part synthesis is worst at.</p>

<div class="note">
  <span class="note-label">Consent, plainly</span>
  <p>Clone your own voice freely. Clone anyone else's only with explicit, documented permission for the specific use. There is no clever workaround here, and there is no version of this that ages well if you get it wrong.</p>
</div>

<h2>Music</h2>

<p>Generated music has gone from novelty to usable quickly. Three practical notes: generate <em>to length</em> rather than cutting a full track down; generate variations of the same cue so you have material to edit with; and check the licence terms for commercial use before a track becomes structural to your piece.</p>

<p>And leave room. Wall-to-wall music flattens a film. The moment music drops out is one of the strongest tools you have, and it costs nothing.</p>

<h2>Sound design</h2>

<p>This is where AI film work most often gives itself away, because generated video frequently arrives silent or with generic audio. Build it deliberately:</p>

<ul>
  <li>Every shot gets an ambience bed. Every one.</li>
  <li>Every significant on-screen action gets a sound, even a subtle one.</li>
  <li>Change of location means change of ambience — that shift is what tells the audience where they are.</li>
  <li>Sound can cross a cut before or after the picture does. This is the oldest trick in editing for making a sequence feel intentional, and it works just as well here.</li>
</ul>

<h2>Mixing</h2>

<p>You do not need a mixing engineer's ear for a short piece. You need three habits: keep dialogue and narration clearly on top; duck music under voice; and check the whole thing on phone speakers, because that is where most of it will be heard. If the voice is unclear on a phone, nothing else you did matters.</p>

  thesis: 'The edit is where a folder of generated clips becomes a film — or fails to. It is also where AI work is most often abandoned one pass too early.',

  body: `
<p class="lede">Everything before this chapter produced material. This is the only stage that produces a film. It is also the stage where the difference between amateur and professional AI work is most visible, because generated clips do not cut themselves together and nothing about the tools encourages you to do the work.</p>

<h2>Choosing an editor</h2>

<div class="defs">
  <dl class="def"><dt>DaVinci Resolve</dt><dd>Free tier that is genuinely professional, with the industry's leading colour tools built in. The strongest default for this kind of work, particularly because you will be grading a lot.</dd></dl>
  <dl class="def"><dt>Premiere Pro</dt><dd>Industry standard, deep integration with the rest of Adobe, ubiquitous in agency and client workflows. Subscription.</dd></dl>
  <dl class="def"><dt>Final Cut Pro</dt><dd>Fast and efficient on Apple hardware, one-time purchase, magnetic timeline that people love or hate.</dd></dl>
  <dl class="def"><dt>Remotion</dt><dd>Video as React code. Utterly different proposition: programmatic, version-controlled, parameterised, capable of rendering a thousand variants from data. For anyone with development skills, this is a genuine unlock for templated and personalised work.</dd></dl>
</div>

<p>Any of them will finish your film. Pick one and learn it properly rather than sampling all four — editing speed comes from muscle memory, and muscle memory does not transfer.</p>

<h2>Assembly</h2>

<p>Lay everything out in script order, no trimming, and watch it. It will be too long and it will be flat. That is expected — you are looking for whether the structure works, not whether it plays.</p>

<p>Then cut for story: remove anything that does not advance or deepen. This is where the shot you spent four hours generating gets deleted, and where the discipline of the edit meets the sunk cost of production. Cut it anyway. The audience does not know what it cost.</p>

<h2>Pacing</h2>

<p>Pacing is rhythm, and rhythm needs variety. Uniform shot lengths are the most common failure in AI edits, because generated clips arrive in uniform durations and it is tempting to just lay them end to end.</p>

<ul>
  <li>Vary shot length deliberately. Long, long, short, short, short, very long.</li>
  <li>Cut on motion — a cut inside a movement is nearly invisible; a cut between two still frames announces itself.</li>
  <li>Let the important shot breathe. Give it a beat longer than feels comfortable.</li>
  <li>Use J-cuts and L-cuts: bring the next shot's audio in early, or hold the previous shot's audio over the new picture. This is the single fastest way to make a sequence stop feeling like assembled clips.</li>
</ul>

<div class="widget" data-widget="pacing"></div>

<h2>Colour</h2>

<p>Grading matters more here than in conventional work, because your shots came from different generations and will not match. The order that works:</p>

<ol>
  <li><strong>Match</strong> shot to shot first — exposure, then white balance, then contrast. Uniformity before style.</li>
  <li><strong>Grade</strong> the sequence as a whole, applying your palette decision from the concept.</li>
  <li><strong>Shape</strong> individual shots — a subtle vignette, a lift in the eyes, holding down a distracting bright area.</li>
  <li><strong>Unify</strong> with a light film emulation, grain, and a touch of halation. Uniform grain across mismatched sources does a surprising amount of work to make them feel like one film.</li>
</ol>

<h2>Export</h2>

<p>Master first, then derive everything else from it: H.264 or H.265, high bitrate, at your working resolution and frame rate. Every platform version comes from the master, never from another export. Re-encoding an export is how a film that looked good in your timeline arrives soft and blocky.</p>

<p>Keep the project file, the master, and the source clips together. In six months someone will ask for a fifteen-second cutdown, and it should be an hour of work rather than a reconstruction.</p>

<div class="note">
  <span class="note-label">The last pass</span>
  <p>Leave it overnight and watch once more in the morning, all the way through, without touching anything. You will see three things you cannot unsee. Fix those three and stop.</p>
</div>

{

  n: 16,
  title: 'Creative Direction',
  thesis: 'Directing generative work is directing a crew that never gets tired, never pushes back, and never tells you the idea is bad.',

  body: `
<p class="lede">The technical parts of this medium are learnable in months. The professional parts — running revisions without losing your mind, translating client vagueness into direction, finding the right file eleven months later — are what determine whether you can do this as a job.</p>

<h2>Managing revisions</h2>

<p>Generative work invites infinite revision, which is precisely the danger. When another version costs three minutes, "let's just try one more" has no natural stopping point, and both you and the client will keep pulling that lever forever.</p>

<div class="defs">
  <dl class="def"><dt>Define rounds</dt><dd>Two rounds included, additional rounds billed. Written into the agreement before you start, not negotiated when it is already ugly.</dd></dl>
  <dl class="def"><dt>Batch feedback</dt><dd>Collect all notes for a round, then work. Never act on notes as they trickle in — you will do the same shot four times.</dd></dl>
  <dl class="def"><dt>Version everything</dt><dd>v01, v02, v03. Never "final", never "final_v2". You will be asked to go back, and you will be asked more often than in conventional production because going back is cheap.</dd></dl>
  <dl class="def"><dt>Show fewer options</dt><dd>Three, with a recommendation. Twenty options is not generosity, it is abdication — you are asking the client to do your selection work.</dd></dl>
</div>

<h2>Working with clients</h2>

<p>Two things are different about AI-assisted work, and both need managing early.</p>

<p><strong>Expectations run wild.</strong> Clients have seen the demos and assume anything is instant. Set the real shape at kickoff: fast to explore, slow to perfect, and some specific things — exact logos, exact products, exact real people — remain genuinely difficult.</p>

<p><strong>Disclosure is a real question.</strong> Some clients need to know, some have policies, some brands cannot use it at all. Ask early rather than late. Late is where the expensive version of this conversation lives.</p>

<h2>Feedback loops</h2>

<p>Most client notes are unusable as given — not because clients are careless, but because describing a visual feeling is genuinely hard. Your job is translation.</p>

<div class="widget" data-widget="feedback"></div>

<p>The technique underneath is always the same: convert a feeling into a variable. "Make it pop" is a feeling. Saturation, contrast, a brighter key, a stronger colour separation between subject and background are variables. Ask which one, or propose one and show it.</p>

<p>And ask the question that saves entire rounds: <em>"Can you show me an example of what you mean?"</em> One reference beats a paragraph of adjectives every time.</p>

<h2>Version control and asset management</h2>

<p>You will generate thousands of files. Without a system, you will lose the good one.</p>

<ul>
  <li><strong>Folder per project, then per stage:</strong> concept, visdev, motion, audio, edit, delivery.</li>
  <li><strong>Filenames that sort and describe:</strong> <span class="code">shot-012_v03_seed44190.mp4</span>.</li>
  <li><strong>Keep the recipe with the file:</strong> prompt, seed, model and version in a sidecar text file or a spreadsheet row. This is the single habit that most reliably separates people who can repeat their results from people who cannot.</li>
  <li><strong>Three-tier storage:</strong> working drive, backup, archive. Generated material is expensive to recreate exactly — often impossible, if the model has moved on.</li>
  <li><strong>Keep selects separate from everything else.</strong> A "picks" folder per stage means the good frames are never buried in the noise.</li>
</ul>

<div class="note">
  <span class="note-label">The scope clause you need</span>
  <p>Because iteration is cheap, scope creep is the default in this medium rather than the exception. Write down what a deliverable is: number of shots, duration, formats, revision rounds. Everything outside that is a new estimate — said kindly, said early, and said the same way every time.</p>
</div>
`,

  body: `
<p class="lede">You can lose a substantial share of your audience to a crop that cuts off a face, a first frame that says nothing, or captions that are illegal on the platform you posted to. None of this is creative work. All of it is the difference between the film being seen and not.</p>

<h2>Aspect ratios</h2>

<div class="defs">
  <dl class="def"><dt>16:9</dt><dd>YouTube, LinkedIn, web embeds, broadcast. The default landscape frame.</dd></dl>
  <dl class="def"><dt>9:16</dt><dd>Shorts, Reels, TikTok, Stories. Full-screen vertical, and increasingly where the audience actually is.</dd></dl>
  <dl class="def"><dt>1:1</dt><dd>Feed-safe square. Rarely optimal, rarely wrong.</dd></dl>
  <dl class="def"><dt>4:5</dt><dd>The tallest allowed in most feeds. Takes more screen than square without going full vertical.</dd></dl>
  <dl class="def"><dt>2.39:1</dt><dd>Anamorphic scope. Cinematic on a big screen, and a thin letterboxed strip on a phone.</dd></dl>
</div>

<div class="widget" data-widget="ratio"></div>

<h2>Shooting for the crop</h2>

<p>If you know a piece will run in both landscape and vertical, decide before you generate. Two approaches, and one of them is much better:</p>

<ul>
  <li><strong>Generate wide, crop later.</strong> Cheap, and it works if you compose with a protected centre. Frame with the vertical crop in mind: keep the subject and any critical action inside the middle third.</li>
  <li><strong>Generate per format.</strong> Better results, more cost. A vertical frame is not a cropped landscape frame — the composition, the shot size and often the whole idea are different.</li>
</ul>

<p>For anything where the vertical version is the main deliverable, generate it natively. A cropped landscape shot almost always reads as an afterthought, because it is one.</p>

<h2>Platform notes</h2>

<div class="defs">
  <dl class="def"><dt>YouTube</dt><dd>The only major platform where long-form genuinely thrives. Thumbnail and title do most of the work of getting the view. Chapters help retention on anything over a few minutes.</dd></dl>
  <dl class="def"><dt>Shorts / Reels / TikTok</dt><dd>Vertical, sound-on but caption-supported, and the first second is the entire battle. Keep text clear of the platform UI along the bottom and right edges.</dd></dl>
  <dl class="def"><dt>LinkedIn</dt><dd>Sound-off by default and captions are non-negotiable. Native uploads are favoured over links. Context in the post copy matters as much as the film.</dd></dl>
  <dl class="def"><dt>Instagram feed</dt><dd>4:5 takes maximum real estate. The cover frame is your thumbnail — choose it deliberately rather than accepting frame one.</dd></dl>
</div>

<h2>Thumbnails and first frames</h2>

<p>Treat the thumbnail as a design job, not a screenshot. A face with a clear expression, high contrast, minimal text, readable at the size of a stamp. Then check it at that size, because that is where it will be judged.</p>

<p>The first frame matters just as much for autoplay surfaces. A fade from black is elegant on a cinema screen and invisible in a feed — you have spent your most valuable moment on nothing.</p>

<h2>Captions and accessibility</h2>

<p>Most feed video is watched muted. Captions are not an accessibility box to tick, they are a retention feature — and they are also an accessibility requirement, and both things being true is convenient.</p>

<p>Burn them in for feed platforms, and supply a caption file where the platform supports it. Auto-generated captions need correcting: names, brands and technical terms are exactly what they get wrong, and those are exactly the words that matter.</p>

<h2>Distribution</h2>

<p>Publishing is not distribution. Post it, then actually put it in front of people: send it directly to the ten people whose opinion you want, post it where your peers are, write about how you made it. For AI-assisted work in particular, the process is frequently more interesting to the audience than the piece — and a breakdown thread will often outperform the film itself.</p>

<div class="note">
  <span class="note-label">One master, many exports</span>
  <p>Every platform version derives from the same high-bitrate master. Never re-encode an export. Keep a delivery folder with every version, labelled by platform and date, so the next request is a copy rather than a re-render.</p>
</div>
`,

<p class="lede">Every working creative in this field eventually builds a pipeline that looks slightly wrong to everyone else and is exactly right for them. That is the goal. What follows is a frame to hang your own on — six stages that every generative project passes through, whatever tools are current.</p>

<h2>The six stages</h2>

<div class="defs">
  <dl class="def"><dt>1 · Inputs</dt><dd>What you gather before creating: references, briefs, brand assets, existing footage, research. Weak inputs guarantee a weak project, and no later stage can rescue them.</dd></dl>
  <dl class="def"><dt>2 · Ideation</dt><dd>Turning inputs into a concept: premise, structure, visual direction. Mostly thinking and writing. Almost no generation.</dd></dl>
  <dl class="def"><dt>3 · Generation</dt><dd>Producing raw material — stills first, then motion, then audio. High volume, low precision. The stage everyone mistakes for the whole job.</dd></dl>
  <dl class="def"><dt>4 · Refinement</dt><dd>Selection, repair, upscaling, consistency passes. Where quality is actually decided.</dd></dl>
  <dl class="def"><dt>5 · Editing</dt><dd>Assembly into a piece: cut, sound, grade. The stage that makes it a film rather than a folder.</dd></dl>
  <dl class="def"><dt>6 · Delivery</dt><dd>Exports, formats, publishing, archive, documentation. The stage most people improvise, and therefore repeat badly.</dd></dl>
</div>

<div class="widget" data-widget="workflow"></div>

<h2>Designing yours</h2>

<p>For each stage, answer four questions. Write the answers down — an undocumented workflow is not a workflow, it is a habit.</p>

<ul>
  <li><strong>What tool do I use, and what is my fallback if it disappears or doubles in price?</strong></li>
  <li><strong>What is the input and what is the output?</strong> A stage with a fuzzy output is where projects stall.</li>
  <li><strong>How long does it actually take me?</strong> Measured, not estimated. Your estimates are wrong in a consistent direction, and knowing which direction is worth money.</li>
  <li><strong>What is the gate?</strong> What has to be true before I am allowed to move to the next stage?</li>

<p>That last one is the most valuable and the least common. A gate is a promise to yourself: no motion generation until every shot has an approved key frame. No editing until every shot is at final duration. Gates are what stop you from discovering in the edit that the whole thing does not work.</p>

<h2>Find your bottleneck</h2>

<p>Every pipeline has exactly one stage that dominates the time. Optimising anything else is theatre. Time three projects, honestly, and you will find it — and it is very often not where you assumed.</p>

<p>Common ones: selection (too many outputs, no criteria), consistency (rebuilding a character every session), and delivery (redoing exports because nothing was documented). All three are process problems rather than tool problems, which is good news — process is free to fix.</p>

<h2>Automate the boring parts, not the creative ones</h2>

<p>The right things to automate are the mechanical ones: batch renaming, contact sheets, watch folders for upscaling, export presets, project templates, a spreadsheet or a small script that logs prompt, seed and model automatically.</p>

  body: `
<p class="lede">Everything specific in this book has a half-life. The model names in Chapter 3 will look quaint. Some techniques in Part IV will be unnecessary because the tools will have absorbed them. That is fine and expected — it is why the structure of this course puts principles first and products last.</p>

<h2>How models actually evolve</h2>

<p>Progress is not smooth. It comes in jumps, separated by plateaus where everything gets cheaper and more controllable rather than more capable. Both phases matter, and the second one is usually where your work improves most, because control is what production actually needs.</p>

<p>Watch for these patterns:</p>

<ul>
  <li><strong>Capabilities become features.</strong> What takes a specialist workflow this year becomes a checkbox next year. Do not over-invest in mastering a workaround.</li>
  <li><strong>Quality floors rise.</strong> The worst output gets better faster than the best output does — which steadily erodes the advantage of merely competent work.</li>
  <li><strong>Control lags capability.</strong> Models can do impressive things long before you can direct them precisely. Directability is the frontier that matters for professionals.</li>
  <li><strong>Costs fall, then usage rises.</strong> Cheaper generation does not reduce budgets. It raises expectations of volume.</li>
</ul>

<h2>Staying current without drowning</h2>

<p>The field produces more noise per week than any person can absorb, and most of it is demos engineered to look good. A sustainable filter:</p>

<div class="defs">
  <dl class="def"><dt>Follow practitioners, not announcers</dt><dd>People shipping actual work will tell you what a tool is really like. Accounts that only post launches are advertising.</dd></dl>
  <dl class="def"><dt>Ignore demo reels</dt><dd>Every demo is the best of ten thousand attempts. Your benchmark set is worth more than any showcase.</dd></dl>
  <dl class="def"><dt>Batch your evaluation</dt><dd>One afternoon a month to test what has changed. Not a running tab open all week.</dd></dl>
  <dl class="def"><dt>Wait a fortnight</dt><dd>Let a release be used in anger by other people first. The gap between launch quality and real quality shows up quickly.</dd></dl>
  <dl class="def"><dt>Learn from adjacent crafts</dt><dd>Cinematography, editing, sound and design books published decades ago are still correct, and are a better use of an evening than a changelog.</dd></dl>
</div>

<h2>Evaluating a new tool</h2>

<div class="widget" data-widget="evaluate"></div>

<h2>Keeping your skills portable</h2>

<p>Some things transfer to every tool that will ever exist, and some do not. Invest accordingly.</p>

<div class="defs">
  <dl class="def"><dt>Transfers completely</dt><dd>Story, visual language, taste, direction, sound, editing, client craft.</dd></dl>
  <dl class="def"><dt>Transfers mostly</dt><dd>Prompting principles, the iteration loop, consistency strategy, pipeline design.</dd></dl>
  <dl class="def"><dt>Does not transfer</dt><dd>Interface knowledge, one platform's parameter quirks, model-specific incantations.</dd></dl>
</div>

<p>The ratio of your learning time across those three should not be equal — and for most people it currently is, or worse.</p>

<h2>Where this leaves you</h2>

<p>You have a conceptual model of how these systems work, a way to classify any tool put in front of you, an economic frame for costing work, a loop for producing at volume, a vocabulary for directing images, and a pipeline you designed rather than inherited.</p>

/* ---------------------------- Glossary ---------------------------- */

const GLOSSARY = [
  ['Aggregator', 'A platform that routes to many models behind one account and one bill — useful for comparison and for not rebuilding an integration every time you switch.'],
  ['Aspect ratio', 'The shape of the frame. 16:9 landscape, 9:16 vertical, 1:1 square, 4:5 tall feed, 2.39:1 scope.'],
  ['Attention', 'The transformer mechanism that weighs how relevant each part of an input is to each other part. Why word order and proximity change your results.'],
  ['Credit', 'A platform abstraction over compute cost. Always convert to real currency per second of usable output before comparing tools.'],
  ['Diffusion', 'The dominant approach for image and video models: train a model to remove noise, then generate by repeatedly removing noise from pure static, steered by a prompt.'],
  ['Fine-tune', 'A small, cheap training run that nudges an existing model toward a style, subject or face. A LoRA is one common form.'],
  ['Frontier lab', 'An organisation training the largest general-purpose models. Broad capability, heavy research spend, fast movement.'],
  ['Hallucination', 'Confidently wrong output. Not a bug in a specific routine — a consequence of a model always producing the most plausible continuation with no separate check on truth.'],
  ['Image-to-video', 'Generating motion from a supplied still. The professional default, because composition, character and light are already locked.'],
  ['Inference', 'Running a trained model to get an output. What you pay for per generation. It does not change the model.'],
  ['Inpainting', 'Regenerating a masked region of an existing image while keeping the rest. The core repair technique.'],
  ['J-cut / L-cut', 'Bringing the next shot audio in before its picture, or holding the previous shot audio over new picture. The fastest way to stop a sequence feeling like assembled clips.'],
  ['Kill criteria', 'A limit decided in advance for when to stop pursuing a shot — for example, twenty generations without a keeper means the shot is wrong, not the prompt.'],
  ['Latent space', 'The compressed internal representation a model works in, where similar meanings sit near each other. A prompt steers toward a neighbourhood; a seed picks the point.'],
  ['LoRA', 'A small trained adapter that shifts a base model toward a specific style, character or subject without retraining the whole model.'],
  ['Master', 'The single high-bitrate export every platform version is derived from. Never re-encode an export.'],
  ['Motivated light', 'Light with a plausible in-world source. Unmotivated light is the most common tell in amateur generative work.'],
  ['Open weights', 'Model parameters you can download and run yourself, usually under a conditional licence. Not the same as open source — training data is rarely public.'],
  ['Prompt adherence', 'How closely a model does what you asked, rather than something adjacent and attractive. For directed work it matters more than raw beauty.'],
  ['Reference conditioning', 'Supplying an image to constrain style, composition, character, depth or pose. Far more precise than describing the same thing in words.'],
  ['Safe area', 'The region of the frame that survives platform UI and cropping. Keep critical action and text inside it.'],
  ['Seed', 'The number that determines the specific starting noise. Holding it fixed lets you change one variable at a time.'],
  ['Stage gate', 'A condition that must be true before moving to the next stage of a pipeline — for example, no motion generation until every shot has an approved key frame.'],
  ['Style frame', 'A key image made before production that defines the look. The visual thesis everything later is judged against.'],
  ['Temporal coherence', 'Consistency of subject, light and physics across frames. The expensive part of video generation, and where it usually breaks.'],
  ['Token', 'The billing unit for language models — roughly three-quarters of a word. Input and output are priced separately.'],
  ['Training', 'The one-time, expensive process of tuning a model weights. Done by the lab. Nothing you type at inference changes it.'],
  ['Upscaling', 'Increasing resolution after the fact. It invents detail, so check skin and eyes against the original, and do it after the edit.'],
  ['Voice conversion', 'Changing the voice of a real recorded performance, keeping human timing and emphasis. Usually better than text-to-speech for anything with acting in it.'],
  ['Yield rate', 'Usable outputs divided by total generations. The number that actually determines a generative budget, and the only one you control.'],
];

let toastTimer = 0;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('is-on'), 2000);
}

function copyText(text) {
  const done = () => toast('Copied to clipboard');
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (err) { toast('Copy failed — select and copy manually'); }
  document.body.removeChild(ta);
}

function download(filename, text) {
  const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

let query = '';

function matches(c) {
  if (!query) return { ok: true, snippet: '' };
  const q = query.toLowerCase();

  if ((c.terms || []).join(' ').toLowerCase().includes(q)) return { ok: true, snippet: 'key term' };
  const idx = c.plain.toLowerCase().indexOf(q);
  if (idx > -1) {
    const from = Math.max(0, idx - 28);
    const raw = c.plain.slice(from, idx + q.length + 42);
    return {
      ok: true,
      snippet: (from > 0 ? '…' : '') + esc(raw).replace(new RegExp('(' + q.replace(/[.*+?^$\{\}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>') + '…',

  }
  return { ok: false, snippet: '' };
}

        (m.snippet ? '<span class="hit">' + m.snippet + '</span>' : '') +

        return `<div class="q${answered ? ' is-answered' : ''}" data-q="${qi}">
          <p class="q-stem">${esc(q.stem)}</p>
          <div class="q-opts">
            ${q.opts.map((o, oi) => {
              let state = '';
              if (answered) {
                if (oi === q.a) state = 'right';
                else if (oi === picked) state = 'wrong';
              }
              return `<button type="button" class="opt" data-opt="${oi}"${answered ? ' disabled' : ''}${state ? ' data-state="' + state + '"' : ''}>
                <span class="mk">${String.fromCharCode(65 + oi)}</span><span>${esc(o)}</span>
              </button>`;
            }).join('')}
          </div>
          <p class="q-why">${esc(q.why)}</p>
        </div>`;
      }).join('')}
    </div>
  </div>
</div>` : '';

  const tasks = (c.tasks || []).length ? `
<div class="widget">
  <div class="widget-head"><h4>Practice</h4><span class="tag">${c.tasks.length} exercise${c.tasks.length > 1 ? 's' : ''}</span></div>
  <div class="widget-body">
    <div class="tasks">
      ${c.tasks.map((t, ti) => {
        const on = ((store.tasks[c.id] || {})[ti]);
        return `<label class="task"><input type="checkbox" data-task="${ti}"${on ? ' checked' : ''} /><span>${esc(t)}</span></label>`;
      }).join('')}
    </div>
  </div>
</div>` : '';

  const notes = `
<div class="widget">
  <div class="widget-head"><h4>Your notes</h4><span class="tag" id="notes-state">Saved in this browser</span></div>
  <div class="widget-body">
    <label class="vh" for="notes-field">Notes for this chapter</label>
    <textarea id="notes-field" placeholder="What did you take from this chapter? What will you try?">${esc(store.notes[c.id] || '')}</textarea>
  </div>
</div>`;

  const prev = CHAPTERS[c.i - 1];
  const next = CHAPTERS[c.i + 1];

  return `
<article class="chapter" data-ch="${c.id}">
  <div class="col-main">
    <header class="ch-head">
      <p class="ch-eyebrow"><span class="dot"></span>Part ${esc(p.roman)} · ${esc(p.title)}</p>
      <span class="ch-number">${c.n <= 19 ? 'Chapter ' + String(c.n).padStart(2, '0') : 'Appendix'}</span>
      <h1 class="ch-title">${esc(c.title)}</h1>
      <p class="ch-thesis">${esc(c.thesis)}</p>
      <div class="ch-meta">
        <span>${c.minutes} min read</span>
        ${c.quiz ? '<span>' + c.quiz.length + ' questions</span>' : ''}
        ${c.tasks ? '<span>' + c.tasks.length + ' exercises</span>' : ''}
        ${c.deliverable ? '<span>Deliverable</span>' : ''}
      </div>
    </header>
    <div class="prose">${c.body}</div>
    ${quiz}
    ${tasks}
    ${notes}
    <div class="ch-foot">
      <button type="button" class="btn btn-primary" data-done="${c.id}">${store.done[c.id] ? '✓ Read' : 'Mark as read'}</button>
      <span class="topbar-spacer"></span>
      <button type="button" class="btn btn-ghost" data-go="">Contents</button>
    </div>
    <div class="pager">
      ${prev ? `<button type="button" class="pager-link prev" data-go="${prev.id}"><span class="dir">← Previous</span><span class="t">${esc(prev.title)}</span></button>` : '<button type="button" class="pager-link prev" disabled><span class="dir">← Previous</span><span class="t">Cover</span></button>'}
      ${next ? `<button type="button" class="pager-link next" data-go="${next.id}"><span class="dir">Next →</span><span class="t">${esc(next.title)}</span></button>` : '<button type="button" class="pager-link next" disabled><span class="dir">Next →</span><span class="t">End of book</span></button>'}
    </div>
  </div>
  <aside class="col-side">${side.join('')}</aside>
</article>`;
}

/* ------------------------------ Render ------------------------------ */

const reader = $('#reader');

function render() {
  const id = location.hash.replace('#/', '');
  const c = byId[id];

  if (!c) {
    reader.dataset.part = '1';
    reader.innerHTML = coverHTML();
    $('#crumb-part').textContent = 'Contents';
    $('#crumb-title').textContent = 'CTRL+SHIFT Academy';
    $('#done-btn').hidden = true;
  } else {
    reader.dataset.part = String(c.part);
    reader.innerHTML = chapterHTML(c);
    $('#crumb-part').textContent = 'Part ' + partOf(c.part).roman;
    $('#crumb-title').textContent = c.title;
    $('#done-btn').hidden = false;
    $('#done-btn').setAttribute('aria-pressed', store.done[c.id] ? 'true' : 'false');
    $('#done-btn').textContent = store.done[c.id] ? '✓ Read' : 'Mark read';
    store.last = c.id;
    save();
    mountWidgets(c);
    wireChapter(c);
  }

  buildTOC();
  paintProgress();
  window.scrollTo(0, 0);
  reader.focus({ preventScroll: true });
}

function go(id) {
  const target = '#/' + (id || '');
  if (location.hash === target) render();
  else location.hash = target;
  closeRail();
}

window.addEventListener('hashchange', render);

/* --------------------------- Chapter wiring --------------------------- */

function wireChapter(c) {
  $$('.q', reader).forEach((qEl) => {
    const qi = Number(qEl.dataset.q);
    $$('.opt', qEl).forEach((btn) => {
      btn.addEventListener('click', () => {
        if (qEl.classList.contains('is-answered')) return;
        const pick = Number(btn.dataset.opt);
        const correct = c.quiz[qi].a;
        store.quiz[c.id] = store.quiz[c.id] || {};
        store.quiz[c.id][qi] = pick;
        save();
        $$('.opt', qEl).forEach((b, bi) => {
          b.disabled = true;
          if (bi === correct) b.dataset.state = 'right';
          else if (bi === pick) b.dataset.state = 'wrong';
        });
        qEl.classList.add('is-answered');
        toast(pick === correct ? 'Correct' : 'Not quite — read the note');
      });
    });
  });

  $$('.task input', reader).forEach((box) => {
    box.addEventListener('change', () => {
      store.tasks[c.id] = store.tasks[c.id] || {};
      store.tasks[c.id][Number(box.dataset.task)] = box.checked;
      save();
    });
  });

  const field = $('#notes-field', reader);
  if (field) {
    field.addEventListener('input', () => {
      store.notes[c.id] = field.value;
      save();
      const state = $('#notes-state', reader);
      if (state) {
        state.textContent = 'Saved';
        clearTimeout(field._t);
        field._t = setTimeout(() => { state.textContent = 'Saved in this browser'; }, 1400);
      }
    });
  }
}

function setDone(id, val) {
  if (val) store.done[id] = true;
  else delete store.done[id];
  save();
  paintProgress();
  buildTOC();
  const foot = $('[data-done="' + id + '"]', reader);
  if (foot) foot.textContent = val ? '✓ Read' : 'Mark as read';
  const top = $('#done-btn');
  top.setAttribute('aria-pressed', val ? 'true' : 'false');
  top.textContent = val ? '✓ Read' : 'Mark read';
}

document.addEventListener('click', (e) => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { go(goEl.dataset.go); return; }
  const doneEl = e.target.closest('[data-done]');
  if (doneEl) {
    const id = doneEl.dataset.done;
    setDone(id, !store.done[id]);
    if (store.done[id]) {
      const c = byId[id];
      const next = CHAPTERS[c.i + 1];
      toast(next ? 'Marked read · next: ' + next.title : 'Marked read · that is the whole book');
    }
  }
});

$('#done-btn').addEventListener('click', () => {
  const id = location.hash.replace('#/', '');
  if (byId[id]) setDone(id, !store.done[id]);
});

/* ------------------------------ Rail ------------------------------ */

function openRail() {
  $('#rail').classList.add('is-open');
  $('#scrim').hidden = false;
  requestAnimationFrame(() => $('#scrim').classList.add('is-on'));
  $('#rail-btn').setAttribute('aria-expanded', 'true');
}

function closeRail() {
  $('#rail').classList.remove('is-open');
  $('#scrim').classList.remove('is-on');
  $('#rail-btn').setAttribute('aria-expanded', 'false');
  setTimeout(() => { $('#scrim').hidden = true; }, 220);
}

$('#rail-btn').addEventListener('click', () => {
  if ($('#rail').classList.contains('is-open')) closeRail();
  else openRail();
});

$('#scrim').addEventListener('click', closeRail);

/* ----------------------------- Search ----------------------------- */

const searchInput = $('#search');
searchInput.addEventListener('input', () => {
  query = searchInput.value.trim();
  buildTOC();
});

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) {
    e.preventDefault();
    openRail();
    searchInput.focus();
    searchInput.select();
    return;
  }
  if (e.key === 'Escape') {
    if (typing) { document.activeElement.blur(); return; }
    if ($('#rail').classList.contains('is-open')) { closeRail(); return; }
    go('');
    return;
  }
  if (typing) return;
  const c = byId[location.hash.replace('#/', '')];
  if (e.key === 'ArrowRight' || e.key === 'j') {
    const next = c ? CHAPTERS[c.i + 1] : CHAPTERS[0];
    if (next) { e.preventDefault(); go(next.id); }
  } else if (e.key === 'ArrowLeft' || e.key === 'k') {
    if (!c) return;
    const prev = CHAPTERS[c.i - 1];
    e.preventDefault();
    go(prev ? prev.id : '');
  }
});

$('#export-btn').addEventListener('click', () => {

    '',

    '',
    '- Chapters read: ' + p.n + ' of ' + READABLE + ' (' + p.pct + '%)',

    lines.push('## ' + (c.n <= 19 ? String(c.n).padStart(2, '0') + ' · ' : '') + c.title);
    lines.push('');

/* ============================== Widgets ============================== */

function widgetShell(el, title, tag, html) {
  el.innerHTML = '<div class="widget-head"><h4>' + title + '</h4><span class="tag">' + tag + '</span></div>' +
    '<div class="widget-body">' + html + '</div>';
  return $('.widget-body', el);
}

function fitCanvas(cv, h) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth || 520;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  cv.style.height = h + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx: ctx, w: w, h: h };
}

/* Read a token from the reading pane so canvases pick up the part stage light */
function cssVar(name) {
  const el = document.querySelector('.reader') || document.documentElement;
  return getComputedStyle(el).getPropertyValue(name).trim() ||
    getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* --- 2 · Latent space pad --- */

WIDGETS.latent = (el) => {
  const corners = [
    { x: 0, y: 0, label: 'Documentary realism' },
    { x: 1, y: 0, label: 'Studio glamour' },
    { x: 0, y: 1, label: 'Grainy 16mm memory' },
    { x: 1, y: 1, label: 'Clean product render' },
  ];
  const body = widgetShell(el, 'Latent space, as a room', 'Drag the point',
    '<p>Nearby points mean nearby ideas. Drag to move through the neighbourhood and watch which references the position sits between — this is what a prompt, a seed and a reference image are each doing.</p>' +
    '<canvas id="lat-cv" aria-label="A two-dimensional map of visual styles with a draggable point"></canvas>' +
    '<div id="lat-bars"></div>' +
    '<div class="readout" id="lat-out"></div>');

  const cv = $('#lat-cv', body);
  const bars = $('#lat-bars', body);
  const out = $('#lat-out', body);
  let px = 0.34, py = 0.6;

  bars.innerHTML = corners.map((c, i) =>
    '<div class="bar-row"><span>' + esc(c.label.split(' ')[0]) + '</span><span class="bar"><span id="lb' + i + '"></span></span><span class="val" id="lv' + i + '">0%</span></div>').join('');

  function weights() {
    return corners.map((c) => {
      const d = Math.hypot(c.x - px, c.y - py);
      return 1 / (0.08 + d * d);
    });
  }

  function draw() {
    const g = fitCanvas(cv, 220);
    const ctx = g.ctx;
    const light = cssVar('--light') || '#56ffc4';
    ctx.clearRect(0, 0, g.w, g.h);
    ctx.strokeStyle = cssVar('--rule-soft') || 'rgba(255,255,255,.07)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 8; i++) {
      ctx.beginPath(); ctx.moveTo((g.w / 8) * i, 0); ctx.lineTo((g.w / 8) * i, g.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, (g.h / 8) * i); ctx.lineTo(g.w, (g.h / 8) * i); ctx.stroke();
    }
    ctx.font = '10px ui-monospace, monospace';
    ctx.fillStyle = cssVar('--muted') || '#888';
    corners.forEach((c) => {
      const x = 10 + c.x * (g.w - 20);
      const y = 16 + c.y * (g.h - 26);
      ctx.textAlign = c.x ? 'right' : 'left';
      ctx.fillText(c.label, x + (c.x ? -2 : 2), y);
    });
    const cx = 10 + px * (g.w - 20);
    const cy = 16 + py * (g.h - 26);
    ctx.strokeStyle = light;
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = light;
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();

    const w = weights();
    const total = w.reduce((a, b) => a + b, 0);
    const pcts = w.map((v) => Math.round((v / total) * 100));
    pcts.forEach((v, i) => {
      $('#lb' + i, bars).style.width = v + '%';
      $('#lv' + i, bars).textContent = v + '%';
    });
    const top = pcts.map((v, i) => ({ v: v, i: i })).sort((a, b) => b.v - a.v);
    out.innerHTML = '<span class="k">You are standing between</span> <span class="v">' +
      esc(corners[top[0].i].label) + '</span> <span class="k">and</span> <span class="v">' + esc(corners[top[1].i].label) + '</span>';
  }

  function move(e) {
    const r = cv.getBoundingClientRect();
    const pt = e.touches ? e.touches[0] : e;
    px = clamp((pt.clientX - r.left) / r.width, 0, 1);
    py = clamp((pt.clientY - r.top) / r.height, 0, 1);
    draw();
  }

  let dragging = false;
  cv.addEventListener('pointerdown', (e) => { dragging = true; cv.setPointerCapture(e.pointerId); move(e); });
  cv.addEventListener('pointermove', (e) => { if (dragging) move(e); });
  cv.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('resize', draw);
  draw();
};

/* --- 2b · Diffusion --- */

WIDGETS.diffusion = (el) => {
  const body = widgetShell(el, 'Denoising, step by step', 'Drag the slider',
    '<p>Generation starts from pure static and removes noise repeatedly. Watch what appears first — the composition is settled long before any detail is.</p>' +
    '<canvas id="dif-cv" aria-label="A generated frame emerging from noise as the step count increases"></canvas>' +
    '<div class="field"><span class="field-label">Denoising step <output id="dif-out">0 / 40</output></span>' +
    '<input type="range" id="dif-range" min="0" max="40" value="0" /></div>' +
    '<div class="readout" id="dif-note"></div>');

  const cv = $('#dif-cv', body);
  const range = $('#dif-range', body);
  const out = $('#dif-out', body);
  const note = $('#dif-note', body);

  const noise = document.createElement('canvas');
  noise.width = 160; noise.height = 90;
  const nctx = noise.getContext('2d');
  const img = nctx.createImageData(160, 90);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.floor(Math.random() * 255);
    img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  nctx.putImageData(img, 0, 0);

  function scene(ctx, w, h) {
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#1b2733');
    sky.addColorStop(0.55, '#3d4a55');
    sky.addColorStop(1, '#8a8378');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = 'rgba(255,240,200,0.22)';
    ctx.beginPath(); ctx.arc(w * 0.7, h * 0.34, h * 0.5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#202a31';
    ctx.beginPath();
    ctx.moveTo(0, h * 0.74);
    ctx.quadraticCurveTo(w * 0.3, h * 0.68, w * 0.55, h * 0.76);
    ctx.lineTo(w, h * 0.72);
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.closePath();
    ctx.fill();

    const bx = w * 0.28;
    const by = h * 0.72;
    ctx.fillStyle = '#11171b';
    ctx.beginPath();
    ctx.moveTo(bx - 13, by);
    ctx.lineTo(bx - 8, by - h * 0.44);
    ctx.lineTo(bx + 8, by - h * 0.44);
    ctx.lineTo(bx + 13, by);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,238,190,0.95)';
    ctx.fillRect(bx - 7, by - h * 0.48, 14, h * 0.05);
    ctx.fillStyle = 'rgba(255,238,190,0.12)';
    ctx.beginPath();
    ctx.moveTo(bx, by - h * 0.455);
    ctx.lineTo(w, by - h * 0.62);
    ctx.lineTo(w, by - h * 0.12);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = 'rgba(140,150,160,0.28)';
    ctx.fillRect(0, h * 0.6, w, h * 0.22);
  }

  function draw() {
    const step = Number(range.value);
    const t = step / 40;
    const g = fitCanvas(cv, 200);
    const ctx = g.ctx;
    ctx.clearRect(0, 0, g.w, g.h);
    ctx.save();
    const blur = (1 - t) * 26;
    if ('filter' in ctx) ctx.filter = 'blur(' + blur.toFixed(1) + 'px)';
    scene(ctx, g.w, g.h);
    ctx.restore();
    ctx.globalAlpha = Math.pow(1 - t, 1.35);
    ctx.imageSmoothingEnabled = t < 0.35;
    ctx.drawImage(noise, 0, 0, g.w, g.h);
    ctx.globalAlpha = 1;

    out.textContent = step + ' / 40';
    let msg;
    if (step === 0) msg = 'Pure noise. No image exists yet — only a random starting point.';
    else if (step < 6) msg = 'Large shapes resolve first. The composition is being decided right now.';
    else if (step < 16) msg = 'Structure is locked. Everything after this refines what is already there.';
    else if (step < 30) msg = 'Detail and texture. Notice the layout has not changed since step six.';
    else msg = 'Refinement only. If the composition were wrong, more steps would not save it.';
    note.innerHTML = '<span class="v">' + esc(msg) + '</span>';
  }

  range.addEventListener('input', draw);
  window.addEventListener('resize', draw);
  draw();
};

    '<div id="b-bars"></div>' +

    const shots = get('shots'), len = get('len'), att = get('att');
    const rate = get('rate') / 100, rev = get('rev') / 100, still = get('still');

    $('#b-shots', body).value = shots;
    $('#b-len', body).value = len;
    $('#b-att', body).value = att;
    $('#b-rate', body).value = '$' + rate.toFixed(2);
    $('#b-rev', body).value = Math.round(rev * 100) + '%';
    $('#b-still', body).value = still;

    const genSeconds = shots * len * att * (1 + rev);
    const videoCost = genSeconds * rate;
    const stillCost = shots * still * 0.04 * (1 + rev);
    const total = videoCost + stillCost;
    const finished = shots * len;
    const perMinute = finished ? (total / finished) * 60 : 0;
    const yieldPct = Math.round((1 / att) * 100);

    const max = Math.max(videoCost, stillCost, 1);
    bars.innerHTML =
      '<div class="bar-row"><span>Video gen</span><span class="bar"><span style="width:' + (videoCost / max) * 100 + '%"></span></span><span class="val">$' + videoCost.toFixed(0) + '</span></div>' +

    out.innerHTML =
      '<span class="k">Finished duration</span> <span class="v">' + finished + 's</span><br />' +
      '<span class="k">Seconds actually generated</span> <span class="v">' + Math.round(genSeconds) + 's</span> <span class="k">(yield ' + yieldPct + '%)</span><br />' +
      '<span class="k">Total</span> <span class="v">$' + total.toFixed(0) + '</span> &nbsp; <span class="k">Per finished minute</span> <span class="v">$' + perMinute.toFixed(0) + '</span><br /><br />' +

          : 'A realistic shape: cheap decisions resolved in stills, expensive seconds spent only on shots you have already approved.') + '</span>';
  }

  ids.forEach((k) => $('#r-' + k, body).addEventListener('input', paint));
  paint();
};

WIDGETS.shot = (el) => {
  const sizes = ['Extreme wide', 'Wide', 'Medium', 'Close-up', 'Extreme close-up'];
  const lenses = [['14mm', 0.9], ['24mm', 0.72], ['35mm', 0.55], ['50mm', 0.42], ['85mm', 0.3], ['135mm', 0.2]];
  const lights = ['hard key from frame left', 'soft window light from frame right', 'backlit, subject in silhouette', 'single practical, tungsten', 'overcast top light', 'sodium vapour street lamp'];
  const moves = ['static', 'slow push in', 'pull back', 'pan left', 'tilt up', 'tracking with subject', 'handheld drift'];

  const body = widgetShell(el, 'Compose a shot', 'Direction, not adjectives',
    '<div class="grid-2">' +
    '<div class="field"><span class="field-label">Shot size</span><select id="sh-size">' + sizes.map((s) => '<option>' + s + '</option>').join('') + '</select></div>' +
    '<div class="field"><span class="field-label">Lens</span><select id="sh-lens">' + lenses.map((l) => '<option>' + l[0] + '</option>').join('') + '</select></div>' +
    '<div class="field"><span class="field-label">Light</span><select id="sh-light">' + lights.map((l) => '<option>' + l + '</option>').join('') + '</select></div>' +
    '<div class="field"><span class="field-label">Movement</span><select id="sh-move">' + moves.map((m) => '<option>' + m + '</option>').join('') + '</select></div>' +
    '</div>' +
    '<canvas id="sh-cv" aria-label="Diagram of the framing and lens angle for the chosen shot"></canvas>' +
    '<div class="readout" id="sh-out"></div>' +
    '<div><button type="button" class="btn" id="sh-copy">Copy as direction</button></div>');

  const cv = $('#sh-cv', body), out = $('#sh-out', body);
  const sel = (id) => $('#sh-' + id, body);

  function draw() {
    const g = fitCanvas(cv, 210);
    const ctx = g.ctx;
    const light = cssVar('--light') || '#56ffc4';
    const rule = cssVar('--rule') || 'rgba(255,255,255,.14)';
    ctx.clearRect(0, 0, g.w, g.h);

    const fw = Math.min(g.w - 40, (g.h - 76) * 1.78);
    const fh = fw / 1.78;
    const fx = (g.w - fw) / 2, fy = 10;
    ctx.strokeStyle = rule;
    ctx.lineWidth = 1;
    ctx.strokeRect(fx, fy, fw, fh);
    ctx.setLineDash([3, 4]);
    for (let i = 1; i < 3; i++) {
      ctx.beginPath(); ctx.moveTo(fx + (fw / 3) * i, fy); ctx.lineTo(fx + (fw / 3) * i, fy + fh); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(fx, fy + (fh / 3) * i); ctx.lineTo(fx + fw, fy + (fh / 3) * i); ctx.stroke();
    }
    ctx.setLineDash([]);

    const scale = [0.1, 0.28, 0.55, 0.82, 1.35][sizes.indexOf(sel('size').value)];
    const headH = fh * 0.34 * scale;
    const headW = headH * 0.72;
    const cx = fx + fw * 0.38;
    const baseY = fy + fh * 0.92;
    ctx.fillStyle = light;
    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.arc(cx, Math.max(fy + headH * 0.5, baseY - headH * 2.4), headH * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(cx - headW, Math.max(fy + headH, baseY - headH * 1.9), headW * 2, headH * 1.9);
    ctx.globalAlpha = 1;

    /* Lens angle of view, drawn in the band below the frame */
    const spread = lenses[lenses.findIndex((l) => l[0] === sel('lens').value)][1];
    const apexY = g.h - 20;
    const coneTop = fy + fh;
    ctx.strokeStyle = light;
    ctx.globalAlpha = 0.45;
    ctx.beginPath();
    ctx.moveTo(g.w / 2 - (fw / 2) * spread, coneTop);
    ctx.lineTo(g.w / 2, apexY);
    ctx.lineTo(g.w / 2 + (fw / 2) * spread, coneTop);
    ctx.stroke();
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = light;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = light;
    ctx.beginPath();
    ctx.arc(g.w / 2, apexY, 3, 0, Math.PI * 2);
    ctx.fill();

    const lightDir = sel('light').value.includes('left') ? -1 : sel('light').value.includes('right') ? 1 : 0;
    ctx.fillStyle = cssVar('--muted') || '#888';
    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'center';
    if (lightDir) {
      const lx = lightDir < 0 ? fx + 14 : fx + fw - 14;
      ctx.fillText('☀', lx, fy + 16);
    } else if (sel('light').value.includes('Backlit') || sel('light').value.includes('backlit')) {
      ctx.fillText('☀', fx + fw / 2, fy + 14);
    }
    ctx.fillText(sel('lens').value + ' · ' + sel('size').value.toLowerCase(), g.w / 2, g.h - 4);
  }

  function line() {
    return sel('size').value + ', ' + sel('lens').value + ', ' + sel('light').value + ', camera ' + sel('move').value + '.';
  }

  function paint() {
    draw();
    out.innerHTML = '<span class="k">Shot direction</span><br /><span class="v">' + esc(line()) + '</span><br /><br />' +
      '<span class="k">' + (sel('move').value === 'static'
        ? 'A held frame is the most reliable choice in generative video — no coherence risk, and performance carries the shot.'
        : 'Every move is a coherence risk. Be able to say what this one means.') + '</span>';
  }

  ['size', 'lens', 'light', 'move'].forEach((k) => sel(k).addEventListener('change', paint));
  window.addEventListener('resize', draw);
  $('#sh-copy', body).addEventListener('click', () => copyText(line()));
  paint();
};

    const words = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    const secs = (words / wpm) * 60;
    const over = secs - tgt;
    const shots = Math.max(1, Math.round(tgt / 2.6));
    out.innerHTML =
      '<span class="k">Words</span> <span class="v">' + words + '</span> &nbsp; ' +
      '<span class="k">Runs</span> <span class="v">' + secs.toFixed(1) + 's</span> &nbsp; ' +
      '<span class="k">Target</span> <span class="v">' + tgt + 's</span><br /><br />' +
      (words === 0 ? '<span class="k">Paste a draft to see whether the script and the film are the same length.</span>'
        : over > 2 ? '<span class="k">Over by <span class="v">' + over.toFixed(1) + 's</span> — roughly ' + Math.ceil((over / 60) * wpm) + ' words to cut. Cut now, not in the edit.</span>'
          : over < -4 ? '<span class="k">Under by ' + Math.abs(over).toFixed(1) + 's. Room for the picture to breathe — or the script is thin.</span>'
            : '<span class="k">Fits. At around 2.6 seconds a shot that is about <span class="v">' + shots + ' shots</span> to generate.</span>');
  }
  ta.addEventListener('input', paint);
  $('#r-wpm', body).addEventListener('input', paint);
  $('#r-tgt', body).addEventListener('input', paint);
  paint();
};

/* --- 12 · Prompt builder --- */

WIDGETS.prompt = (el) => {
  const parts = [
    ['subject', 'Subject', 'a night-shift nurse in a creased uniform'],
    ['action', 'Action or state', 'standing still, listening'],
    ['env', 'Environment, one concrete detail', 'hospital corridor, a vending machine humming behind her'],
    ['frame', 'Framing', 'medium shot, slight low angle, doorframe in the foreground'],
    ['lens', 'Lens', '50mm, shallow depth of field'],
    ['light', 'Light', 'overhead fluorescent, hard top light, deep shadow under the eyes'],
    ['palette', 'Palette and texture', 'desaturated green and bone white, fine 35mm grain'],
  ];
  const body = widgetShell(el, 'Build a prompt', 'Order matters',
    '<div class="grid-2">' + parts.map((p) =>
      '<div class="field"><span class="field-label">' + p[1] + '</span><input type="text" id="pr-' + p[0] + '" placeholder="' + esc(p[2]) + '" /></div>').join('') + '</div>' +
    '<div class="readout" id="pr-out"></div>' +
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap"><button type="button" class="btn" id="pr-copy">Copy prompt</button><button type="button" class="btn btn-ghost" id="pr-fill">Fill with the example</button></div>');

  const out = $('#pr-out', body);
  function compose() {
    const bits = parts.map((p) => $('#pr-' + p[0], body).value.trim()).filter(Boolean);
    const text = bits.join(', ');
    out.innerHTML = bits.length
      ? '<span class="v">' + esc(text) + '</span><br /><br /><span class="k">' + bits.length + ' of 7 elements. Front-loaded: the first clause gets the most attention, and the last competes with everything before it.</span>'
      : '<span class="k">Fill the fields, or load the example. Notice that none of them ask for a mood word.</span>';
    return text;
  }
  parts.forEach((p) => $('#pr-' + p[0], body).addEventListener('input', compose));
  $('#pr-copy', body).addEventListener('click', () => { const t = compose(); t ? copyText(t) : toast('Nothing to copy yet'); });
  $('#pr-fill', body).addEventListener('click', () => {
    parts.forEach((p) => { $('#pr-' + p[0], body).value = p[2]; });
    compose();
  });
