};

/* --- 13 · Motion prompt --- */

WIDGETS.motion = (el) => {
  const moves = {
    'static': [0, 0, 1],
    'slow push in': [0, 0, 1.18],
    'pull back': [0, 0, 0.84],
    'pan left': [-0.16, 0, 1],
    'tilt up': [0, -0.14, 1],
    'tracking with subject': [0.14, 0, 1],
  };
  const body = widgetShell(el, 'Motion only', 'The frame is already locked',
    '<div class="grid-2">' +
    '<div class="field"><span class="field-label">Camera</span><select id="mo-cam">' + Object.keys(moves).map((m) => '<option>' + m + '</option>').join('') + '</select></div>' +
    '<div class="field"><span class="field-label">Subject action</span><input type="text" id="mo-sub" placeholder="she turns her head toward the light" /></div>' +
    '<div class="field"><span class="field-label">Ambient motion</span><input type="text" id="mo-amb" placeholder="steam drifts left, fabric settles" /></div>' +
    '<div class="field"><span class="field-label">Speed</span><select id="mo-spd"><option>slow and deliberate</option><option>natural speed</option><option>sudden</option></select></div>' +
    '</div>' +
    '<canvas id="mo-cv" aria-label="Diagram showing the chosen camera move"></canvas>' +
    '<div class="readout" id="mo-out"></div>' +
    '<div><button type="button" class="btn" id="mo-copy">Copy motion prompt</button></div>');

  const cv = $('#mo-cv', body), out = $('#mo-out', body);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let raf = 0, t0 = 0;

  function draw(now) {
    const g = fitCanvas(cv, 150);
    const ctx = g.ctx;
    const light = cssVar('--light') || '#56ffc4';
    ctx.clearRect(0, 0, g.w, g.h);
    const m = moves[$('#mo-cam', body).value];
    const phase = reduce ? 0.5 : (Math.sin(((now - t0) / 2400) * Math.PI * 2) + 1) / 2;

    const bw = g.w * 0.52, bh = bw / 1.78;
    ctx.strokeStyle = cssVar('--rule') || '#333';
    ctx.strokeRect((g.w - bw) / 2, (g.h - bh) / 2, bw, bh);

    const z = 1 + (m[2] - 1) * phase;
    const dx = m[0] * phase * g.w * 0.5;
    const dy = m[1] * phase * g.h * 0.5;
    const mw = bw * z, mh = bh * z;
    ctx.strokeStyle = light;
    ctx.lineWidth = 1.5;
    ctx.strokeRect((g.w - mw) / 2 + dx, (g.h - mh) / 2 + dy, mw, mh);
    ctx.fillStyle = light;
    ctx.globalAlpha = 0.14;
    ctx.fillRect((g.w - mw) / 2 + dx, (g.h - mh) / 2 + dy, mw, mh);
    ctx.globalAlpha = 1;
    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = cssVar('--muted') || '#888';
    ctx.fillText($('#mo-cam', body).value, g.w / 2, g.h - 6);

    if (!reduce) raf = requestAnimationFrame(draw);
  }

  function line() {
    const bits = ['camera ' + $('#mo-cam', body).value];
    const sub = $('#mo-sub', body).value.trim();
    const amb = $('#mo-amb', body).value.trim();
    if (sub) bits.push(sub);
    if (amb) bits.push(amb);
    bits.push($('#mo-spd', body).value);
    return bits.join(', ') + '.';
  }

  function paint() {
    out.innerHTML = '<span class="k">Motion prompt</span><br /><span class="v">' + esc(line()) + '</span><br /><br />' +
      '<span class="k">Nothing here describes what the shot looks like. That is the point — the approved frame already carries it, and every descriptive word you add competes with the motion you actually want.</span>';
  }

  ['cam', 'sub', 'amb', 'spd'].forEach((k) => $('#mo-' + k, body).addEventListener('input', paint));
  $('#mo-copy', body).addEventListener('click', () => copyText(line()));
  $('#mo-cam', body).addEventListener('change', () => { t0 = performance.now(); });
  t0 = performance.now();
  if (reduce) draw(0); else raf = requestAnimationFrame(draw);
  el._cleanup = () => cancelAnimationFrame(raf);
  paint();
};

/* --- 14 · Mix --- */

WIDGETS.mix = (el) => {
  const layers = [
    ['amb', 'Ambience', 42, 'Room tone under every shot. Never noticed, always missed.'],
    ['sfx', 'Effects', 55, 'Two or three placed hits per shot sell physical reality.'],
    ['voice', 'Voice', 80, 'Leads the mix. If it is unclear on a phone, nothing else matters.'],
    ['score', 'Score', 45, 'Supports a feeling the picture earns. Ducked under voice.'],
  ];
  const body = widgetShell(el, 'Build the mix', 'Four layers',
    layers.map((l) =>
      '<div class="field"><span class="field-label">' + l[1] + ' <output id="mx-o-' + l[0] + '">' + l[2] + '</output></span>' +
      '<input type="range" id="mx-' + l[0] + '" min="0" max="100" value="' + l[2] + '" /></div>').join('') +
    '<div class="readout" id="mx-out"></div>');

  const out = $('#mx-out', body);
  function paint() {
    const v = {};
    layers.forEach((l) => { v[l[0]] = Number($('#mx-' + l[0], body).value); $('#mx-o-' + l[0], body).value = v[l[0]]; });
    const notes = [];
    if (v.voice <= v.score) notes.push('Score is competing with the voice. Duck it — this is the single most common mix failure.');
    if (v.amb < 15) notes.push('Almost no ambience. The gaps between sounds will read as synthetic.');
    if (v.sfx < 15) notes.push('No effects. Actions on screen with no sound break physical reality.');
    if (v.score > 85) notes.push('Wall-to-wall music flattens a film. The moment it drops out is a tool you are not using.');
    if (!notes.length) notes.push('A workable balance: voice on top, ambience present, effects placed, score supporting. Check it on phone speakers before you call it.');
    out.innerHTML = layers.map((l) => '<span class="k">' + l[1] + '</span> <span class="v">' + v[l[0]] + '</span>').join(' &nbsp; ') +
      '<br /><br /><span class="k">' + notes.map(esc).join('<br />') + '</span>';
  }
  layers.forEach((l) => $('#mx-' + l[0], body).addEventListener('input', paint));
  paint();
};

/* --- 15 · Pacing --- */

WIDGETS.pacing = (el) => {
  const presets = {
    'Flat — every shot equal': [3, 3, 3, 3, 3, 3, 3, 3],
    'Building': [5, 4, 3, 2.5, 2, 1.5, 1, 4],
    'Breathing': [6, 1.5, 1.5, 5, 1, 1, 1, 7],
    'Feed hook': [1, 1, 1.5, 2, 1, 3, 1, 1.5],
  };
  const body = widgetShell(el, 'Read the rhythm', 'Pick a pattern',
    '<div class="chips" id="pa-chips">' + Object.keys(presets).map((k, i) =>
      '<button type="button" class="chip' + (i === 0 ? ' is-on' : '') + '" data-k="' + esc(k) + '">' + esc(k.split(' —')[0]) + '</button>').join('') + '</div>' +
    '<div id="pa-strip" style="display:flex;gap:2px;align-items:stretch;height:2.6rem"></div>' +
    '<div class="readout" id="pa-out"></div>');

  const strip = $('#pa-strip', body), out = $('#pa-out', body);

  function paint(key) {
    const arr = presets[key];
    const total = arr.reduce((a, b) => a + b, 0);
    const mean = total / arr.length;
    const sd = Math.sqrt(arr.reduce((s, v) => s + (v - mean) * (v - mean), 0) / arr.length);
    strip.innerHTML = arr.map((v, i) =>
      '<div style="flex:' + v + ';border-radius:3px;background:color-mix(in srgb, var(--light) ' + (18 + (v / Math.max.apply(null, arr)) * 40) + '%, transparent);' +
      'border:1px solid color-mix(in srgb, var(--light) 40%, transparent);display:flex;align-items:center;justify-content:center;' +
      'font-family:var(--mono);font-size:.6rem;color:var(--paper);overflow:hidden">' + v + 's</div>').join('');
    const variety = sd / mean;
    out.innerHTML = '<span class="k">Total</span> <span class="v">' + total.toFixed(1) + 's</span> &nbsp; ' +
      '<span class="k">Average shot</span> <span class="v">' + mean.toFixed(1) + 's</span> &nbsp; ' +
      '<span class="k">Variation</span> <span class="v">' + (variety * 100).toFixed(0) + '%</span><br /><br /><span class="k">' +
      (variety < 0.15 ? 'No rhythm. This is what happens when generated clips of equal length are laid end to end — the most common failure in AI edits.'
        : variety < 0.45 ? 'Some shape. Try holding one shot considerably longer than feels comfortable and see what it does to the sequence.'
          : 'Real rhythm. Long holds against fast runs is what makes a cut feel intentional rather than assembled.') + '</span>';
  }

  $$('.chip', body).forEach((c) => c.addEventListener('click', () => {
    $$('.chip', body).forEach((c2) => c2.classList.remove('is-on'));
    c.classList.add('is-on');
    paint(c.dataset.k);
  }));
  paint(Object.keys(presets)[0]);
};

/* --- 16 · Feedback translation --- */

WIDGETS.feedback = (el) => {
  const notes = [
    ['Make it pop.', 'Which one: more contrast, more colour separation between subject and background, or a brighter key on the subject? Propose one and show it.'],
    ['It feels cheap.', 'Usually lighting or sound. Ask whether they mean the light looks flat, or whether the audio is thin — they are different fixes.'],
    ['Can it be more premium?', 'Premium is normally slower pacing, less saturation, more negative space and quieter sound design. Show one shot treated that way.'],
    ['I don’t love the character.', 'Casting, wardrobe, or performance? Regenerating the face is the expensive guess. Ask before you spend.'],
    ['Something is off in the middle.', 'Almost always pacing. Time the section — a shot held too long or a missing beat, not a bad shot.'],
    ['Can we see more options?', 'Options are not the fix. Ask what the current version fails to do, then show three deliberate variations of that one thing.'],
  ];
  const body = widgetShell(el, 'Translate the note', 'Tap to reveal',
    '<div class="tasks" id="fb-list">' + notes.map((n, i) =>
      '<button type="button" class="opt" data-i="' + i + '" style="width:100%"><span class="mk">”</span><span><b style="color:var(--paper)">' + esc(n[0]) + '</b><span class="fb-a" id="fb-a-' + i + '" style="display:none"><br />' + esc(n[1]) + '</span></span></button>').join('') + '</div>');
  $$('.opt', body).forEach((btn) => btn.addEventListener('click', () => {
    const a = $('#fb-a-' + btn.dataset.i, body);

/* --- 17 · Ratios --- */

WIDGETS.ratio = (el) => {
  const ratios = [
    ['16:9', 16 / 9, 'YouTube, LinkedIn, web, broadcast. The default landscape frame.'],
    ['9:16', 9 / 16, 'Shorts, Reels, TikTok. Keep text clear of the bottom and right where platform UI sits.'],
    ['1:1', 1, 'Feed-safe square. Rarely optimal, rarely wrong.'],
    ['4:5', 4 / 5, 'The tallest allowed in most feeds — maximum screen without going full vertical.'],
    ['2.39:1', 2.39, 'Anamorphic scope. Cinematic on a large screen, a thin strip on a phone.'],
  ];
  const body = widgetShell(el, 'Frame and safe area', 'Same shot, five deliveries',
    '<div class="chips" id="ra-chips">' + ratios.map((r, i) =>
      '<button type="button" class="chip' + (i === 0 ? ' is-on' : '') + '" data-i="' + i + '">' + r[0] + '</button>').join('') + '</div>' +
    '<div class="ratio-stage"><div class="ratio-box" id="ra-box"><span class="ratio-safe"></span><span class="ratio-label" id="ra-label"></span></div></div>' +
    '<div class="readout" id="ra-out"></div>');

  const box = $('#ra-box', body), label = $('#ra-label', body), out = $('#ra-out', body);
  function paint(i) {
    const r = ratios[i];
    const maxH = 180, maxW = 300;
    let w = maxW, h = maxW / r[1];
    if (h > maxH) { h = maxH; w = maxH * r[1]; }
    box.style.width = Math.round(w) + 'px';
    box.style.height = Math.round(h) + 'px';
    label.textContent = r[0];
    out.innerHTML = '<span class="v">' + esc(r[2]) + '</span><br /><br /><span class="k">The dashed line is the safe area. Anything critical outside it — a face, a logo, burnt-in text — is a delivery you will be redoing.</span>';
  }
  $$('.chip', body).forEach((c) => c.addEventListener('click', () => {
    $$('.chip', body).forEach((c2) => c2.classList.remove('is-on'));
    c.classList.add('is-on');
    paint(Number(c.dataset.i));
  }));
  paint(0);
};

/* --- 18 · Workflow builder --- */

WIDGETS.workflow = (el) => {
  const stages = [
    ['inputs', 'Inputs', 'references, brief, brand assets'],
    ['ideation', 'Ideation', 'premise, structure, visual direction'],
    ['generation', 'Generation', 'stills, then motion, then audio'],
    ['refinement', 'Refinement', 'selection, repair, upscaling'],
    ['editing', 'Editing', 'cut, sound, grade'],
    ['delivery', 'Delivery', 'exports, publishing, archive'],
  ];
  const saved = store.notes['__workflow'] ? JSON.parse(store.notes['__workflow']) : {};
  const body = widgetShell(el, 'Your six stages', 'Saved and exportable',
    '<p>Name the tool you use at each stage and the fallback if it disappears tomorrow. A workflow you have not written down is a habit.</p>' +
    stages.map((s) =>
      '<div class="field"><span class="field-label">' + s[1] + ' <output>' + s[2] + '</output></span>' +
      '<div class="grid-2">' +
      '<input type="text" id="wf-' + s[0] + '-tool" placeholder="tool" value="' + esc((saved[s[0]] || {}).tool || '') + '" />' +
      '<input type="text" id="wf-' + s[0] + '-fb" placeholder="fallback" value="' + esc((saved[s[0]] || {}).fb || '') + '" />' +
      '</div></div>').join('') +
    '<div class="readout" id="wf-out"></div>' +
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap"><button type="button" class="btn btn-primary" id="wf-dl">Download workflow</button><button type="button" class="btn" id="wf-copy">Copy</button></div>');

  const out = $('#wf-out', body);
  function values() {
    const v = {};
    stages.forEach((s) => {
      v[s[0]] = { tool: $('#wf-' + s[0] + '-tool', body).value.trim(), fb: $('#wf-' + s[0] + '-fb', body).value.trim() };
    });
    return v;
  }
  function md() {
    const v = values();
    return ['# My generative pipeline', ''].concat(stages.map((s, i) =>
      '## ' + (i + 1) + ' · ' + s[1] + '\n\n- Tool: ' + (v[s[0]].tool || '_undecided_') + '\n- Fallback: ' + (v[s[0]].fb || '_none — this is a single point of failure_') + '\n')).join('\n');
  }
  function paint() {
    const v = values();
    store.notes['__workflow'] = JSON.stringify(v);
    save();
    const named = stages.filter((s) => v[s[0]].tool).length;
    const exposed = stages.filter((s) => v[s[0]].tool && !v[s[0]].fb);
    out.innerHTML = '<span class="k">Stages with a named tool</span> <span class="v">' + named + ' / 6</span><br /><br />' +
      (exposed.length ? '<span class="k">No fallback for: <span class="v">' + exposed.map((s) => esc(s[1])).join(', ') + '</span>. Each one is a stage that stops working if a vendor changes its pricing.</span>'
        : named === 6 ? '<span class="k">Every stage has a tool and an alternative. This is what makes the next model release an afternoon rather than a rebuild.</span>'
          : '<span class="k">Fill in the rest. The stages will outlast every tool you write in them.</span>');
  }
  stages.forEach((s) => {
    $('#wf-' + s[0] + '-tool', body).addEventListener('input', paint);
    $('#wf-' + s[0] + '-fb', body).addEventListener('input', paint);
  });
  $('#wf-dl', body).addEventListener('click', () => download('my-pipeline.md', md()));
  $('#wf-copy', body).addEventListener('click', () => copyText(md()));
  paint();
};

/* --- 19 · Tool evaluation --- */

WIDGETS.evaluate = (el) => {
  const criteria = [
    ['Does it beat my benchmark set?', 'The only test that matters. Marketing reels are the best of ten thousand attempts.'],
    ['Is it directable, not just capable?', 'Can you get the specific thing you asked for, repeatably?'],
    ['Does it fit a stage I already have?', 'A tool that does not slot into your pipeline is a hobby.'],
    ['Are my assets portable out of it?', 'If leaving costs you your work, you are not a customer, you are a hostage.'],
    ['Is the cost per usable output sane?', 'Not the subscription. The cost per keeper at your real yield rate.'],
    ['Would I still want it if the novelty wore off?', 'Ask again in two weeks. Most launches do not survive the question.'],
  ];
  const body = widgetShell(el, 'Should I adopt this?', 'Score it honestly',
    criteria.map((c, i) =>
      '<div class="field"><span class="field-label">' + esc(c[0]) + '</span>' +
      '<div class="chips" data-c="' + i + '">' +
      ['No', 'Partly', 'Yes'].map((l, li) => '<button type="button" class="chip" data-v="' + li + '">' + l + '</button>').join('') +
      '</div><span class="notes-status">' + esc(c[1]) + '</span></div>').join('') +
    '<div class="readout" id="ev-out"></div>');

  const scores = new Array(criteria.length).fill(null);
  const out = $('#ev-out', body);
  function paint() {
    const answered = scores.filter((s) => s !== null).length;
    const total = scores.reduce((a, b) => a + (b || 0), 0);
    const max = criteria.length * 2;
    let verdict;
    if (answered < criteria.length) verdict = 'Answer all six. Partial evaluation is how tools get adopted on excitement.';
    else if (total >= max * 0.75) verdict = 'Adopt it — but keep the tool it replaces as your fallback for a month.';
    else if (total >= max * 0.45) verdict = 'Keep it in exploration only. Do not put a client deadline behind it yet.';
    else verdict = 'Skip it. Revisit in a quarter, when the plateau has made it cheaper and more controllable.';
    out.innerHTML = '<span class="k">Score</span> <span class="v">' + total + ' / ' + max + '</span><br /><br /><span class="k">' + esc(verdict) + '</span>';
  }
  $$('[data-c]', body).forEach((group) => {
    $$('.chip', group).forEach((chip) => chip.addEventListener('click', () => {
      $$('.chip', group).forEach((c2) => c2.classList.remove('is-on'));
      chip.classList.add('is-on');
      scores[Number(group.dataset.c)] = Number(chip.dataset.v);
      paint();
    }));
  });
  paint();
};
